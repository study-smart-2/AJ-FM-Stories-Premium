async function deleteEpisode(id){
  const ep = M.eps.find(x => String(x.id) === String(id));
  if (!confirm(`Delete episode ${ep ? ep.no + ': ' + ep.title : ''}?\n\nIt is removed from the app and from the saved import. Listening history for it is removed too.`)) return;
  await once('epd' + id, async () => { try{ await api('/api/admin/episode/delete', {method: 'POST', retry: false, body: JSON.stringify({id: +id})}); toast('Episode deleted'); }catch(e){ toast(adminErr(e)); } loadManage(); loadSaved(); });
}
const BULK_TXT = {free: 'Make free', premium: 'Make premium', hide: 'Hide', publish: 'Publish', delete: 'DELETE'};
async function bulkAction(act, mode){
  const body = {story_id: M.sid, topic: M.scope || '', action: act};
  if (mode === 'page'){
    if (!M.eps.length) return toast('No episodes on this page');
    body.ids = M.eps.map(e => e.id);
  } else {
    const lo = parseInt($('#b_from').value, 10), hi = parseInt($('#b_to').value, 10);
    if (!(lo >= 1) || !(hi >= lo)) return toast('Fill From and To (From must not be greater than To)');
    body.range = {from: lo, to: hi};
  }
  await once('bulk', async () => {
    try{
      const q = await api('/api/admin/episodes/bulk', {method: 'POST', retry: false, body: JSON.stringify({...body, dry_run: true})});
      if (!q.count) return toast('No episodes found there');
      const where = mode === 'page' ? 'on this page' : `in the range ${body.range.from} to ${body.range.to}`;
      const warn = act === 'delete' ? '\n\nThey are removed from the app and from the saved import. Listening history for them is removed too. This cannot be undone.' : '';
      if (!confirm(`${BULK_TXT[act]}: ${q.count} episodes ${where}?${warn}`)) return;
      const r = await api('/api/admin/episodes/bulk', {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify(body)});
      toast(`Done: ${r.count} episodes`);
    }catch(e){ toast(adminErr(e), 5000); }
    if (M.page > 1 && act === 'delete') M.page = 1;
    loadManage(); loadSaved();
  });
}
async function editEpisode(id, patch){
  await once('ep' + id, async () => { try{ await api('/api/admin/episode', {method: 'POST', retry: false, body: JSON.stringify({id: +id, ...patch})}); toast('Saved'); }catch(e){ toast(adminErr(e)); } loadManage(); });
}
async function runImport(dry){
  await once('import', async () => {
    const out = $('#m_result'), text = $('#m_data').value.trim();
    if (!text){ out.textContent = 'Paste the lines or choose a file first.'; return; }
    out.textContent = dry ? 'Checking...' : 'Importing...';
    try{
      const r = await api('/api/admin/episodes/import_files', {method: 'POST', retry: false, timeout: 120000, body: JSON.stringify({story_id: M.sid, topic: M.topic, text, name: M.fileName, dry_run: dry})});
      const acc = (r.access || []).map(a => `<div style="color:var(--${a.ok ? 'ok' : 'warn'})">${esc(a.chat)}: ${esc(a.note)}</div>`).join('');
      out.innerHTML = `<b>${dry ? 'Check finished' : 'Import started'}:</b> ${r.valid} rows are fine, ${r.error_count} have problems.` + (r.note ? `<div>${esc(r.note)}</div>` : '') + acc +
        (r.errors || []).slice(0, 8).map(x => `<div>Row ${x.row}${x.ep_no ? ' (ep ' + x.ep_no + ')' : ''}: ${esc(x.error)}</div>`).join('') + (r.error_count > 8 ? `<div>...and ${r.error_count - 8} more</div>` : '');
      if (!dry){ loadSaved(); setTimeout(() => { if (M.sid && $('#m_list')) loadManage(); }, 8000); }
    }catch(e){ out.textContent = 'Stopped: ' + adminErr(e); }
  });
}

/* ---------- navigation ---------- */
function setTab(t){
  S.tab = t; $$('.bnav button').forEach(b => { const on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  [...stack].forEach(closeSheet); $('#view').scrollTop = 0; window.scrollTo(0, 0);
  if (t === 'home'){ if (S.home) renderHome(); else loadHome(); if (S.home && S.homeState !== 'loading') loadHome(); }
  else if (t === 'browse') renderBrowse(); else if (t === 'library') renderLibrary(); else if (t === 'cart') renderCart(); else renderMe();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target, c = s => t.closest(s);
  let m;
  if (homeClick(c)) return;
  if (comboClick(c)) return;
  if ((m = c('.bnav button'))){ if (m.dataset.tab === 'browse' && S.tab === 'browse') Object.assign(B, {q:'', genre:'', status:'', language:'', sort:'newest', view:'discover'}); return setTab(m.dataset.tab); }
  if (c('#retryHome')){ S.homeState = 'idle'; return loadHome(); }
  if (c('#retryBrowse')) return loadBrowse(B.items.length ? false : true);
  if (c('#retryLib')) return loadLibrary();
  if (c('#retryStory')) return openStory(V.id);
  if (c('#retryEps')) return loadStoryPage(V.page);
  if (c('#retryAdmin')) return loadAdmin();
  if (c('#retryManage')) return loadManage();
  if ((m = c('[data-cartadd]'))){ const on = cartToggle(m.dataset.cartadd); m.classList.toggle('on', on); m.setAttribute('aria-pressed', on); m.textContent = on ? '\u2713' : '\uD83D\uDED2'; return; }
  if ((m = c('[data-cartrm]'))){ const [sid, oid] = m.dataset.cartrm.split('|'); CART = CART.filter(i => !(i.sid === sid && String(i.oid) === oid)); cartSave(); toast(tr('cremd')); return paintCart(); }
  if ((m = c('[data-cartpay]'))){ const [sid, oid] = m.dataset.cartpay.split('|'); return once('buy', async () => { goBot(buyPayload(sid, oid)); await sleep(1200); }); }
  if (c('#cartGo')){ if (!CART.length) return; return once('buy', async () => { try{ const r = await api('/api/cart/checkout', {method: 'POST', retry: false, body: JSON.stringify({code: CP.code || '', items: CART.map(i => ({story_id: i.sid, option_id: i.oid}))})}); if (r.skipped) toast(tr('cskip', {n: r.skipped}), 4500); goBot('cart_' + r.token); await sleep(1200); }catch(e){ toast(errText(e), 4500); } }); }
  if (c('#cpApply')) return cpApply(($('#cp_in') || {}).value, CART.map(i => ({sid: i.sid, oid: i.oid}))).then(paintCart);
  if (c('#sbApply')) return cpApply(($('#sbCode') || {}).value, visOpts().filter(o => +o.price > 0).map(o => ({sid: V.id, oid: o.id}))).then(paintPlanBar);
  if (c('#cpRemove')){ cpRemove(); paintPlanBar(); paintCart(); return; }
  if (c('#offBtn') || c('[data-offers]')) return openOffers();
  if (c('#offBack')) return closeSheet('offerpage');
  if ((m = c('[data-cpcopy]'))) return copyText(m.dataset.cpcopy, tr('cpcopied'));
  if ((m = c('[data-cpuse]'))){ const code = m.dataset.cpuse; return once('cpuse', async () => { await cpApply(code, CART.map(i => ({sid: i.sid, oid: i.oid}))); setTab('cart'); }); }
  if (c('#cartBrowse')) return setTab('home');
  if ((m = c('[data-pgo]'))){ const k = m.dataset.pgo; if (k === 'cart') return setTab('cart'); L.seg = k; return setTab('library'); }
  if ((m = c('[data-udays]'))){ $('#e_udays').value = m.dataset.udays; return true; }
  if (c('[data-terms]')){ showTerms(true); return; }
  if ((m = c('[data-pbot]'))){ goBot(m.dataset.pbot === '1' ? '' : m.dataset.pbot); return; }          // 1 = the bot's home, anything else opens that place in the bot (help, guide, feedback)
  if (c('#preqBtn')) return openRequest('new');

      const b = $('#autofill'); b.disabled = true; b.textContent = 'Reading...';
      try{
        const r = await api('/api/admin/parse', {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify({link})}), f = r.fields || {};
        const set = (id, v) => { if (v) $(id).value = v; };
        set('#e_title', f.title); set('#e_author', f.author); set('#e_genre', f.genre); set('#e_lang', f.language); set('#e_voice', f.voice); set('#e_epstext', f.episodes_text); set('#e_preview', f.description);
        if (f.status) $('#e_status').value = f.status;
        if (r.cover){ E.photo = r.cover; paintPhoto(); }
        toast(r.cover ? 'Details and cover filled in' : 'Details filled in. Add the cover yourself.');
      }catch(err){ toast(adminErr(err), 5000); }
      b.disabled = false; b.textContent = 'Auto-fill details';
    });
  }
  if ((m = c('[data-ejob]'))){
    const kind = m.dataset.ejob;
    if (kind === 'renumber' && !confirm('Give every episode the number written in its file name?\n\nPlans that sell episode ranges use these numbers, so check them afterwards. Listening history is kept.')) return;
    return once('ejob', async () => {
      try{ const r = await api(`/api/admin/episodes/${kind}`, {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify({id: M.sid, all: kind === 'reread', topic: M.topic})}); toast(r.note || 'Started', 6000); }
      catch(err){ toast(adminErr(err), 6000); }
    });
  }
  if (c('#m_check')) return runImport(true);
  if (c('#m_apply')){ if (!confirm('Import these episodes' + (M.tname && M.topic ? ' into ' + M.tname : '') + '?')) return; return runImport(false); }
  if (c('#m_bot')) return goBot(`import_${M.sid}_${M.topic || '0'}`);
  if ((m = c('[data-bulk]'))) return bulkAction(m.dataset.bulk, m.parentElement.dataset.bulkmode);
  if ((m = c('[data-eedit]'))){ M.edit = +m.dataset.eedit; return renderManageList(); }
  if (c('#x_cancel')){ M.edit = null; return renderManageList(); }
  if ((m = c('[data-esave]'))) return saveEpisodeEdit(m.dataset.esave);
  if ((m = c('[data-edel]'))) return deleteEpisode(m.dataset.edel);
  if ((m = c('[data-efree]'))) return editEpisode(m.dataset.efree, {free: !!+m.dataset.to});
  if ((m = c('[data-epub]'))) return editEpisode(m.dataset.epub, {published: !!+m.dataset.to});
  if ((m = c('[data-mpg]'))){ M.page = Math.max(1, M.page + +m.dataset.mpg); return loadManage(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bq'){ B.q = e.target.value.trim(); if (browseMode() !== B.painted) paintBrowse(); return browseSearch(); }
  if (id === 'rq_name'){ R.d.name = e.target.value; return rqCatalogCheck(); }
  if (id === 'rq_plat'){ R.d.platform = e.target.value; $$('[data-rqgrp="platform"] .rq-chip').forEach(b => { const on = b.dataset.rqval === R.d.platform; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); return; }
  if (id === 'rq_link'){ R.d.link = e.target.value; const h = $('#rqLinkHint'); if (h){ const v = e.target.value.trim(); h.textContent = v && !validWebLink(v) ? tr('rqbadlink') : ''; h.className = 'rq-hint' + (v && !validWebLink(v) ? ' bad' : ''); } return; }
  if (id === 'epq'){ V.q = e.target.value.trim(); return epSearch(); }
  if (id === 'asq'){ A.sq = e.target.value.trim(); return adminSearch(); }
  if (id === 'aoq'){ A.oq = e.target.value.trim(); return adminSearch(); }
  if (id === 'm_q'){ M.q = e.target.value.trim(); M.page = 1; return manageSearch(); }
  if (id === 'fSeek'){ P.dragging = true; $('#fCur').textContent = clock(e.target.value); }
  if (id === 'rSlide') setRate(parseFloat(e.target.value));
});
const epSearch = deb(() => loadStoryPage(1), 350), adminSearch = deb(() => loadAdmin(), 350), manageSearch = deb(() => loadManage(), 350);
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (id === 'bsort'){ B.sort = e.target.value; return loadBrowse(true); }
  if (id === 'bstatus'){ B.status = e.target.value; browseChips(); return loadBrowse(true); }
  if (id === 'blangsel'){ B.language = e.target.value; browseChips(); return loadBrowse(true); }
  if (id === 'epf'){ V.filter = e.target.value; return loadStoryPage(1); }
  if (id === 'apub'){ A.pub = e.target.value; return loadAdmin(); }
  if (id === 'aost'){ A.ostatus = e.target.value; return loadAdmin(); }
  if (id === 'fSeek'){ P.dragging = false; audio.currentTime = Number(e.target.value); }
  if (id === 'rq_photo' && e.target.files[0]){ try{ R.photo = await downscale(e.target.files[0], 1200); paintRqPhoto(); }catch(err){ toast(err.message); } }
  if (id === 'bn_cp') return fillBn();
  if (id === 'bn_file' && e.target.files[0]){ try{ const u = await downscale(e.target.files[0], 1200), im = $('#bn_prev'); im.src = u; im.hidden = false; BN.gen = ''; }catch(err){ toast(err.message); } }
  if (id === 'e_photo' && e.target.files[0]){ try{ E.photo = await downscale(e.target.files[0]); paintPhoto(); toast('Photo added'); }catch(err){ toast(err.message); } }
  if (id === 'm_file' && e.target.files[0]){ M.fileName = e.target.files[0].name; $('#m_data').value = await e.target.files[0].text(); toast('File loaded. Tap Check only first.'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'epJump') $('#epGo').click(); });
document.addEventListener('pointerdown', e => {                   // hold the speed buttons to keep stepping by 0.05x
  const b = e.target.closest('#rMinus, #rPlus'); if (!b) return;
  const d = b.id === 'rPlus' ? 0.05 : -0.05; setRate(P.rate + d);
  clearInterval(window._rt); window._rt = setInterval(() => setRate(P.rate + d), 150);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearInterval(window._rt), true));
if (tg) tg.BackButton.onClick(goBack);

/* ---------- start ---------- */
/* ---------- splash screen ---------- */
function splashInit(){
  const el = $('#splash'); if (!el) return;
  const t0 = Date.now();
  let idx = 0, cards = [], homeDone = false, closed = false;
  $('#spTitle').textContent = tr('sptitle'); $('#spSub').textContent = tr('spsub');
  const ints = [];
  const close = () => { if (closed) return; closed = true; ints.forEach(clearInterval); window.splashDone = null; el.classList.add('out'); setTimeout(() => el.remove(), 500); };
  window.splashDone = () => { homeDone = true; };
  const layout = () => { const n = cards.length; cards.forEach((c, i) => { let d = ((i - idx) % n + n) % n; if (d > n / 2) d -= n; c.className = 'sp-card' + (Math.abs(d) <= 2 ? ' p' + d : ''); }); };
  ints.push(setInterval(() => {
    const e = Date.now() - t0;
    if (!homeDone && S.tab !== 'home' && e > 1200) homeDone = true;
    if (e > 9000) homeDone = true;                                       // never trap the user on the splash
    if (homeDone && e >= 1800) close();
  }, 100));
  ints.push(setInterval(() => { if (cards.length > 1){ idx = (idx + 1) % cards.length; layout(); } }, 2200));
  api('/api/catalog?limit=40&sort=popular', {timeout: 8000, retry: false}).then(d => {
    if (closed) return;
    const pool = (d.stories || []).filter(s => s.episodes > 0 && s.title);
    for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const pick = pool.slice(0, 7); if (!pick.length) return;
    const deck = $('#spDeck');
    deck.innerHTML = pick.map(s => `<div class="sp-card">${isImg(s.cover) ? `<img src="${esc(s.cover)}" alt="" data-fb="&#128214;">` : `<div class="sp-emo">${esc(s.cover || '\u{1F4D6}')}</div>`}</div>`).join('');
    cards = $$('#spDeck .sp-card'); idx = 0; layout();
  }).catch(() => {});
}

(function boot(){
  splashInit(); updateCartBadge();
  if (new URLSearchParams(location.search).get('open') === 'library') S.tab = 'library';
  try{ if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
  try{ indexedDB.deleteDatabase('ajfm-offline'); }catch(e){}      // frees the space of episodes saved by the old download feature
  api('/api/away').then(a => { S.away = a; if (S.tab === 'home' && S.home) renderHome(); }).catch(() => {});
  api('/api/terms').then(t => { if (t.user && !t.accepted) showTerms(); }).catch(() => {});
  api('/api/me').then(m => { S.admin = !!m.admin; $('#adminBtn').hidden = !S.admin; }).catch(e => { if (e.network || !navigator.onLine) offlineBoot(); });
  applyTheme(); applyLang(); renderHeader();
  api('/api/wishlist').then(d => { S.wish = new Set(d.ids); if (S.tab === 'home' && S.home) renderHome(); }).catch(() => {});
  api('/api/notices').then(d => { S.notices = d.items; renderHeader(); }).catch(() => {});
  setTab(S.tab);
  const _sid = new URLSearchParams(location.search).get('story');
  const _sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (_sp.startsWith('story_')) setTimeout(() => openStory(_sp.slice(6)), 300);       // shared link: opens the story directly
  else if (_sid) setTimeout(() => openStory(_sid), 300);      // deep link from the bot: ?story=<story id>
})();
