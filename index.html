<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJ's FM Stories Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b101c; --panel:#141b2b; --panel2:#1a2338; --line:#27324d; --gold:#d6ab4f; --gold-2:#f1d48a;
  --text:#f3ecda; --muted:#a3adc2; --ok:#6cc59a; --bad:#e27b7b; --warn:#e8b64c; --nav:60px; --mini:68px;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:40px}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px)}
body.hasplayer{padding-bottom:calc(var(--nav) + var(--mini) + env(safe-area-inset-bottom,0px) + 16px)}
h1,h2,h3,h4{margin:0}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--gold-2);line-height:1}
.brand span{color:var(--text);font-weight:600}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--gold-2)}
.pad{padding:0 16px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.promo{margin:4px 16px 14px;padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,#3a2a0c,#171f35);border:1px solid var(--gold);color:var(--gold-2);font-weight:700}
.promo small{display:block;color:var(--text);font-weight:400;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);min-height:38px}
.chip.on{border-color:var(--gold);color:var(--gold-2);background:rgba(214,171,79,.1)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:10px 16px 8px}
.sec{font-family:var(--serif);font-size:24px;line-height:1.1}
.link{background:none;border:0;color:var(--gold-2);padding:6px 0;font-size:13.5px;min-height:36px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 12px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none;align-items:flex-start}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:136px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 16px;align-items:start}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{display:block;text-align:left;background:none;border:0;padding:0;min-width:0}
.cv{aspect-ratio:3/4;width:100%;border-radius:12px;background:linear-gradient(160deg,#243052,#0f1526);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative}
.cv.has-img{aspect-ratio:auto;display:block;background:#10172a}
.cv.has-img img{width:100%;height:auto;display:block}
.cv .fb{display:flex;aspect-ratio:3/4;align-items:center;justify-content:center;font-size:44px}
.badge{position:absolute;top:8px;left:8px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:1}
.card b{display:block;margin-top:8px;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.card small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.card .pr{color:var(--gold-2);font-weight:700;margin-top:2px;display:block}
.empty{padding:36px 22px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.msg{margin:10px 16px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.msg.bad{border-color:var(--bad);color:var(--text)}
.sk{background:linear-gradient(90deg,#141b2b 25%,#1e2842 50%,#141b2b 75%);background-size:200% 100%;border-radius:12px}
@media (prefers-reduced-motion:no-preference){.sk{animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.sk.card-sk{aspect-ratio:3/4;width:136px;flex:none}
.sk.line{height:16px;margin:8px 16px}
.sk.hero{height:150px;margin:6px 16px}
.feat{display:flex;gap:14px;margin:6px 16px 12px;padding:12px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(130deg,#1d2646,#10172a);text-align:left;width:calc(100% - 32px)}
.feat .cv{width:112px;flex:none}
.feat h3{font-family:var(--serif);font-size:25px;line-height:1.05;color:var(--gold-2);overflow-wrap:anywhere}
.feat p{margin:6px 0 10px;color:#d4cdb9;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat .tagline{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.cont{flex:none;width:250px;display:flex;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;scroll-snap-align:start}
.cont .cv{width:56px;flex:none;font-size:26px}
.cont b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.cont small{color:var(--muted);display:block;font-size:12.5px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:4;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#0e1424;border-top:1px solid var(--line)}
.bnav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative}
.bnav button.on{color:var(--gold-2)}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cartBadge{background:var(--gold);color:#1a1405;border-radius:999px;font-size:10px;padding:0 5px;margin-left:4px;font-weight:700}
.sheet{position:fixed;inset:0;background:var(--ink);overflow:auto;overflow-x:hidden;z-index:6;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet.open{display:block}
body.hasplayer .sheet{padding-bottom:calc(var(--mini) + env(safe-area-inset-bottom,0px) + 40px)}
#fullplayer{z-index:10}#editor,#epman{z-index:8}#admin{z-index:7}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:10px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#1a1405;font-weight:700;padding:11px 16px;border-radius:10px;min-height:44px}
.btn.ghost{background:transparent;color:var(--gold-2)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.small{padding:6px 12px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hero{padding:2px 16px 14px;text-align:center;background:linear-gradient(#1a2444,var(--ink))}
.hero .cv{width:168px;margin:6px auto 14px;font-size:56px}
.hero .cv.has-img{display:inline-block;width:auto;max-width:80%;margin:6px 0 14px}
.hero .cv.has-img img{width:auto;max-width:100%;max-height:50vh}
h2.title{font-family:var(--serif);font-size:32px;line-height:1.05;margin:0 0 4px;color:var(--gold-2);overflow-wrap:anywhere}
.by{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.tag.live{border-color:var(--ok);color:var(--ok)}.tag.gold{border-color:var(--gold);color:var(--gold-2)}.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.warn{border-color:var(--warn);color:var(--warn)}
.desc{margin:12px 16px 2px;color:#d4cdb9;white-space:pre-wrap;overflow-wrap:anywhere}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-size:15px;overflow-wrap:anywhere}
.h3{font-family:var(--serif);font-size:23px;margin:16px 16px 10px}
.plans{display:grid;gap:10px;padding:0 16px}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:rgba(214,171,79,.07);min-height:56px}
.plan span{font-weight:700;min-width:0;overflow-wrap:anywhere}
.plan small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.plan b{color:var(--gold-2);font-size:17px;white-space:nowrap}
.plan.free{border-color:var(--ok);background:rgba(108,197,154,.08)}.plan.free b{color:var(--ok)}
.plan.have{border-color:var(--line);background:var(--panel);opacity:.8}
.plan-card{flex:none;width:190px;scroll-snap-align:start;text-align:left;border:1px solid var(--gold);border-radius:14px;padding:14px;background:linear-gradient(130deg,#1d2646,#10172a);color:var(--text);min-height:150px}
.plan-card.free{border-color:var(--ok)}
.plan-card .tagline{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.plan-card .pr{color:var(--gold-2);font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.plan-card .pr s{font-size:12.5px}
.plan-card .pr b{font-size:16px}
#planRail{scroll-snap-type:x mandatory}
.info{margin:0 16px 10px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.info b{display:block;margin-bottom:2px}.info p{margin:0;color:var(--muted);font-size:13.5px}
.access{margin:10px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--ok);background:rgba(108,197,154,.08);font-size:13.5px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}
.ctl input,.ctl select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 10px}
.pager span{color:var(--muted);font-size:13.5px;text-align:center;flex:1}
.jump{display:flex;gap:8px;padding:0 16px 10px}
.jump input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px;min-width:0}
.ep{display:flex;gap:10px;align-items:center;width:calc(100% - 32px);margin:0 16px 8px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:52px}
.ep.on{border-color:var(--gold);background:rgba(214,171,79,.1)}
.ep.lock{opacity:.65}
.ep .n{min-width:52px;color:var(--gold-2);font-weight:700}
.ep .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep small{color:var(--muted);white-space:nowrap}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.free{border-color:var(--ok);color:var(--ok)}.pill.owned{border-color:var(--gold);color:var(--gold-2)}.pill.lock{border-color:var(--bad);color:var(--bad)}.pill.warn{border-color:var(--warn);color:var(--warn)}
.mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 6px);z-index:9;background:#10172a;border:1px solid var(--gold);border-radius:14px;padding:8px 10px;display:none;align-items:center;gap:10px;height:var(--mini)}
.mini.show{display:flex}
.mini .mcv{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:#243052;display:flex;align-items:center;justify-content:center}
.mini .mcv img{width:100%;height:100%;object-fit:cover}
.mini .mt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.mini .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button.mb{background:none;border:0;color:var(--gold-2);font-size:20px;min-width:44px;height:44px;border-radius:50%}
.mini button#mPlay{background:var(--gold);color:#1a1405}
.mini .mbar{position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mini .mbar i{display:block;height:100%;width:0;background:var(--gold)}
.fp{padding:0 20px 30px;text-align:center}
.fp .cv{width:min(62vw,260px);margin:8px auto 16px}
.fp .cv.has-img{width:auto;max-width:78%;display:inline-block}.fp .cv.has-img img{width:auto;max-width:100%;max-height:38vh}
.fp h2{font-family:var(--serif);font-size:26px;line-height:1.1;color:var(--gold-2);overflow-wrap:anywhere}
.fp .state{min-height:22px;color:var(--muted);font-size:13.5px;margin:6px 0}
.fp .state.bad{color:var(--bad)}
.fp input[type=range]{width:100%;accent-color:var(--gold)}
.fp .times{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.fp .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.fp .row button{background:none;border:0;color:var(--gold-2);font-size:20px;min-width:52px;height:52px}
.fp #fPlay{background:var(--gold);color:#1a1405;border-radius:50%;width:64px;height:64px;font-size:26px}
.fp .opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;text-align:left}
.fp .opt b{display:block;margin-bottom:6px}
.fp .rr{display:flex;align-items:center;gap:8px}.fp .rr input{flex:1}
.fp .rr button,.fp .chiprow button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--gold-2);font-size:13px;min-height:40px}
.fp .bufbar{height:4px;border-radius:2px;background:var(--line);margin:-2px 0 4px;overflow:hidden}.fp .bufbar i{display:block;height:100%;width:0;background:rgba(214,171,79,.45)}
.fp .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fp .chiprow button.on{border-color:var(--gold);background:rgba(214,171,79,.15)}
.field{display:block;margin:0 16px 12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select,.optrow input,.box input,.box select,.box textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.field textarea,.box textarea{min-height:100px;resize:vertical}
.field.check{display:flex;gap:10px;align-items:center}.field.check input{width:22px;height:22px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}.two .field{margin:0 0 12px}
.optrow{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.o4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.o4 input{padding:8px 6px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.note{font-size:12.5px;color:var(--muted);margin:8px 16px;overflow-wrap:anywhere}
.mrow{margin:0 16px 10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.mrow h4{font-family:var(--serif);font-size:19px;overflow-wrap:anywhere}
.box{margin:0 16px 14px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.box>b{display:block;margin-bottom:8px}
.seg{display:flex;gap:6px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--mini) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;display:none;max-width:92%;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">AJ's FM <span>Stories</span></div>
  <button class="ib" id="adminBtn" hidden aria-label="Open admin panel">Admin</button>
</header>
<main id="view" aria-live="polite"></main>

<nav class="bnav" aria-label="Main">
  <button data-tab="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="browse" aria-label="Browse and search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Browse</button>
  <button data-tab="library" aria-label="My library"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>Library</button>
  <button data-tab="cart" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9H8z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6L5 3H3"/></svg>Cart <span id="cartBadge" hidden>0</span></button>
</nav>

<section class="sheet" id="story" aria-label="Story"></section>
<section class="sheet" id="admin" aria-label="Admin panel"></section>
<section class="sheet" id="editor" aria-label="Story editor"></section>
<section class="sheet" id="epman" aria-label="Episode manager"></section>
<section class="sheet" id="fullplayer" aria-label="Player"></section>

<div class="mini" id="mini" role="region" aria-label="Now playing">
  <div class="mcv" id="mCover"></div>
  <button class="mt" id="mOpen" aria-label="Open the full player"><b id="mTitle"></b><small id="mSub"></small></button>
  <button class="mb" id="mPlay" aria-label="Play or pause">&#9654;</button>
  <div class="mbar"><i id="mProg"></i></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ SETTINGS: edit these ============ */
const API_URL      = "https://aj-bot-vbxn.onrender.com";
const BOT_USERNAME = "AJ_FM_Stories_Premium_Robot";
const CURRENCY     = "\u20b9";
const PROMO_TITLE  = "New stories every week";
const PROMO_TEXT   = "Rent or buy a story and listen right here in the app.";
const HOW_IT_WORKS = "Pick a plan, pay, and send the payment screenshot to our bot. Once it is confirmed, your episodes unlock in this app.";
const PAGE_SIZE    = 50;
/* ============================================== */

const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0b101c'); tg.setBackgroundColor('#0b101c'); }catch(e){} }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const deb = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const money = p => { p = Number(p || 0) / 100; return p === 0 ? 'Free' : CURRENCY + (p === Math.floor(p) ? String(p) : p.toFixed(2)); };
const clock = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60, p = n => String(n).padStart(2, '0'); return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`; };
const dateStr = ts => ts ? new Date(ts * 1000).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';
function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms); }
const busy = new Set();
async function once(key, fn){ if (busy.has(key)) return; busy.add(key); try{ return await fn(); } finally { busy.delete(key); } }
const ctls = {};
function fresh(key){ if (ctls[key]) ctls[key].abort(); ctls[key] = new AbortController(); return ctls[key].signal; }

async function api(path, opts = {}){
  const {timeout = 25000, retry = (opts.method || 'GET') === 'GET', ...init} = opts;
  const url = API_URL.replace(/\/$/, '') + path;
  for (let attempt = 0; ; attempt++){
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
    if (init.signal) init.signal.addEventListener('abort', () => ctl.abort(), {once:true});
    try{
      const r = await fetch(url, {...init, signal: ctl.signal, headers: {'Content-Type':'application/json', 'X-Init-Data': tg ? tg.initData : '', ...(init.headers || {})}});
      clearTimeout(timer);
      if (!r.ok){
        let data = null; try{ data = await r.json(); }catch(e){ try{ data = {message: await r.text()}; }catch(e2){} }
        const e = new Error((data && data.message) || `Request failed (${r.status})`); e.status = r.status; e.data = data;
        if (retry && attempt < 1 && [502, 503, 504].includes(r.status)){ await sleep(1500); continue; }
        throw e;
      }
      return await r.json();
    }catch(e){
      clearTimeout(timer);
      if (e.status) throw e;
      if (init.signal && init.signal.aborted){ e.aborted = true; throw e; }
      if (retry && attempt < 1){ await sleep(1500); continue; }
      const ne = new Error(e.name === 'AbortError' ? 'The server took too long to answer. Please try again.' : 'No connection to the server. Check your internet.'); ne.network = true; throw ne;
    }
  }
}
const errText = e => e.status === 401 ? 'Please open this app from Telegram.' : e.status === 429 ? 'Too many requests. Wait a moment and try again.' : (e.message || 'Something went wrong.');

const stack = [];

function goBack(){ const id = stack[stack.length - 1]; if (id) closeSheet(id); }

async function loadHome(){

  catch(e){ if (e.aborted) return; S.homeState = 'error'; S.homeErr = errText(e); }
  if (S.tab === 'home') renderHome();
}
const secRail = (title, items, key, render = card) => items && items.length ? `<div class="sechead"><h2 class="sec">${title}</h2>${key ? `<button class="link" data-viewall="${key}" aria-label="View all ${title}">View all</button>` : ''}</div>

function browseResults(){
  const r = $('#bres'); if (!r) return;
  if (B.state === 'error' && !B.items.length){ r.innerHTML = retryBox(B.err, 'retryBrowse'); return; }
  if (B.state === 'loading' && !B.items.length){ r.innerHTML = `<div class="grid">${Array.from({length: 6}, () => '<div class="sk" style="aspect-ratio:3/4"></div>').join('')}</div>`; return; }
  if (!B.items.length){ r.innerHTML = `<div class="empty">No stories match${B.q ? ` "${esc(B.q)}"` : ' these filters'}.${browseActive() ? '<br><button class="btn ghost small" id="bclear2">Clear search and filters</button>' : ''}</div>`; return; }

    ${B.state === 'error' ? `<div class="msg bad">${esc(B.err)} <button class="link" id="retryBrowse">Retry</button></div>` : ''}</div>`;

async function loadBrowse(reset){
  const sig = fresh('browse');
  if (reset){ B.items = []; }
  B.state = 'loading'; browseResults();
  const qs = new URLSearchParams({limit: 24, offset: B.items.length, sort: B.sort});
  for (const k of ['q', 'genre', 'status', 'language', 'platform']) if (B[k]) qs.set(k, B[k]);
  try{
    const d = await api('/api/catalog?' + qs, {signal: sig, timeout: 60000});
    B.items = reset ? d.stories : B.items.concat(d.stories.filter(s => !B.items.some(x => x.id === s.id)));
    B.total = d.total; if (d.facets){ B.facets = d.facets; browseChips(); } B.state = 'ok';
  }catch(e){ if (e.aborted) return; B.state = 'error'; B.err = errText(e); }
  browseResults();
}

  body.innerHTML = `<div class="rail">${cardSk(3)}</div>`;

  try{
    if (seg === 'owned'){
      const [d, c] = await Promise.all([api('/api/library', {signal: sig}), api('/api/continue', {signal: sig}).catch(() => ({items: []}))]);
      if (L.seg !== seg) return;

      body.innerHTML = d.items.length ? d.items.map(h => (HIST[h.episode_id] = h, `<button class="ep" data-hist="${h.episode_id}" data-story="${esc(h.story_id)}" data-pos="${h.pos}" ${h.available ? '' : 'disabled'}>

        : '<div class="empty">Your listening history will appear here.</div>';
    } else {
      const d = await api('/api/account?limit=60', {signal: sig}); if (L.seg !== seg) return;
      body.innerHTML = d.orders.length ? d.orders.map(o => `<div class="mrow"><h4>${esc(o.title)}</h4><div class="by">${esc(o.plan)} | ${money(Math.round((o.price || 0) * 100))}${o.from ? ` | Episodes ${o.from}-${o.to}` : ''}</div>

        : '<div class="empty">No purchases yet.</div>';
    }
  }catch(e){ if (e.aborted) return; body.innerHTML = retryBox(errText(e), 'retryLib'); }
}

let planSlideTimer = null, planSlidePaused = 0;
function stopPlanSlide(){ if (planSlideTimer){ clearInterval(planSlideTimer); planSlideTimer = null; } }
function startPlanSlide(){
  stopPlanSlide();
  const rail = $('#planRail');
  if (!rail || (V.plan_cards || []).length < 2) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (document.hidden) return;
  planSlideTimer = setInterval(() => {
    if (Date.now() < planSlidePaused) return;
    const card = rail.querySelector('.plan-card');
    if (!card) return;
    const step = card.getBoundingClientRect().width + 12;
    const max = rail.scrollWidth - rail.clientWidth;
    if (rail.scrollLeft >= max - 4) rail.scrollTo({left: 0, behavior: 'smooth'});
    else rail.scrollBy({left: step, behavior: 'smooth'});
  }, 4500);
}
document.addEventListener('pointerdown', e => { if (e.target.closest('#planRail')) planSlidePaused = Date.now() + 15000; }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlanSlide(); else startPlanSlide(); });

async function orderAction(oid, action){
  const needs = action !== 'approve';
  let reason = '';
  if (needs){ reason = (prompt(`Reason for "${action}" (required, saved in the audit log):`) || '').trim(); if (!reason) return toast('A reason is required'); }
  else if (!confirm(`Approve order #${oid}? The buyer gets access immediately.`)) return;
  await once('order' + oid, async () => {
    try{ const r = await api(`/api/admin/order/${oid}/action`, {method: 'POST', retry: false, body: JSON.stringify({action, reason})}); toast(`Order #${oid} is now ${r.status}`); }
    catch(e){ toast(adminErr(e)); }
    loadAdmin();
  });
}

}

  if ((m = c('[data-rend]'))){
    if (!confirm('Close this room now? The episodes are deleted and the member is removed.')) return;
    return once('rend' + m.dataset.rend, async () => { try{ await api(`/api/admin/rooms/${m.dataset.rend}/end`, {method:'POST', retry:false, body:'{}'}); toast('Room closed'); }catch(e){ toast(adminErr(e)); } loadAdmin(); });
  }
  if (c('#cSave')) return once('csave', async () => {
    try{
      await api('/api/admin/coupon', {method:'POST', retry:false, body: JSON.stringify({
        code: $('#cCode').value, kind: $('#cKind').value, value: $('#cValue').value,
        min_order: $('#cMin').value || 0, max_uses: $('#cUses').value || 0,
        max_per_user: $('#cPer').value || 1,
        expires: $('#cExp').value ? parseInt($('#cExp').value) : null,
        stories: $('#cStories').value, option_kinds: $('#cKinds').value, active: true})});
      toast('Coupon saved'); loadAdmin();
    }catch(e){ toast(adminErr(e)); }
  });
  if ((m = c('[data-ctoggle]'))) return once('ctog', async () => {
    try{
      await api('/api/admin/coupon/toggle', {method:'POST', retry:false, body: JSON.stringify({code: m.dataset.ctoggle, active: !!+m.dataset.to})});
      toast('Saved'); loadAdmin();
    }catch(e){ toast(adminErr(e)); }
  });
  if (c('#edClose') || c('#edClose2')) return closeSheet('editor');
  if (c('#emClose')) return closeSheet('epman');
  if (c('#addOpt')){ $('#e_opts').insertAdjacentHTML('beforeend', optRow()); return; }
  if (c('.o-del')) return c('.optrow').remove();
  if (c('#genPacks')){
    const start = parseInt($('#g_start').value) || 1, total = parseInt($('#g_total').value), size = parseInt($('#g_size').value), price = Number($('#g_price').value) || 0;
    if (!total || !size) return toast('Enter total episodes and pack size');
    if (Math.ceil(total / size) > 100) return toast('That makes more than 100 packs. Use a bigger pack size.');
    const end = start + total - 1;
    for (let a = start; a <= end; a += size) $('#e_opts').insertAdjacentHTML('beforeend', optRow({label: `Episodes ${a}-${Math.min(a + size - 1, end)}`, price, days: 0, from: a, to: Math.min(a + size - 1, end)}));
    return;
  }
  if (c('#photoRemove')){ E.photo = ''; E.cover = ''; $('#e_cover').value = ''; $('#e_photo').value = ''; return paintPhoto(); }
  if (c('#saveStory')) return saveEditor();
  if (c('#autofill')){
    const link = $('#e_poster').value.trim(); if (!link) return toast('Paste the poster post link first');
    return once('autofill', async () => {
      const b = $('#autofill'); b.disabled = true; b.textContent = 'Reading...';
      try{
        const r = await api('/api/admin/parse', {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify({link})}), f = r.fields || {};
        const set = (id, v) => { if (v) $(id).value = v; };
        set('#e_title', f.title); set('#e_author', f.author); set('#e_genre', f.genre); set('#e_lang', f.language); set('#e_voice', f.voice); set('#e_epstext', f.episodes_text); set('#e_preview', f.description);
        if (f.status) $('#e_status').value = f.status;
        if (r.cover){ E.photo = r.cover; paintPhoto(); }
        toast(r.cover ? 'Details and cover filled in' : 'Details filled in. Add the cover yourself.');
      }catch(err){ toast(adminErr(err), 5000); }
      b.disabled = false; b.textContent = 'Auto-fill details';
    });
  }
  if (c('#saveLinks')){
    const ep1 = $('#m_ep1').value.trim(), epN = $('#m_epN').value.trim(); if (!ep1) return toast('Paste the Episode 1 link');
    return once('links', async () => {
      try{ const r = await api('/api/admin/links', {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify({id: M.sid, ep1, epN: epN || ep1, append: $('#m_append').checked})}); toast(r.note || 'Links saved', 6000); }
      catch(err){ toast(adminErr(err), 5000); }
    });
  }
  if ((m = c('[data-ejob]'))){
    const kind = m.dataset.ejob;
    if (kind === 'renumber' && !confirm('Give every episode the number written in its file name?\n\nPlans that sell episode ranges use these numbers, so check them afterwards. Listening history is kept.')) return;
    return once('ejob', async () => {
      try{ const r = await api(`/api/admin/episodes/${kind}`, {method: 'POST', retry: false, timeout: 60000, body: JSON.stringify({id: M.sid, all: kind === 'reread'})}); toast(r.note || 'Started', 6000); }
      catch(err){ toast(adminErr(err), 6000); }
    });
  }
  if (c('#m_check')) return runImport(true);
  if (c('#m_apply')){ if (!confirm('Apply these changes to the episodes?')) return; return runImport(false); }
  if ((m = c('[data-eren]'))){ const ep = M.eps.find(x => String(x.id) === m.dataset.eren); const v = prompt('New episode title:', ep ? ep.title : ''); if (v && v.trim()) return editEpisode(m.dataset.eren, {title: v.trim()}); return; }
  if ((m = c('[data-efree]'))) return editEpisode(m.dataset.efree, {free: !!+m.dataset.to});
  if ((m = c('[data-epub]'))) return editEpisode(m.dataset.epub, {published: !!+m.dataset.to});
  if ((m = c('[data-mpg]'))){ M.page = Math.max(1, M.page + +m.dataset.mpg); return loadManage(); }
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bq'){ B.q = e.target.value.trim(); return browseSearch(); }
  if (id === 'epq'){ V.q = e.target.value.trim(); return epSearch(); }
  if (id === 'asq'){ A.sq = e.target.value.trim(); return adminSearch(); }
  if (id === 'aoq'){ A.oq = e.target.value.trim(); return adminSearch(); }
  if (id === 'm_q'){ M.q = e.target.value.trim(); M.page = 1; return manageSearch(); }
  if (id === 'fSeek'){ P.dragging = true; $('#fCur').textContent = clock(e.target.value); }
  if (id === 'rSlide') setRate(parseFloat(e.target.value));
});
const epSearch = deb(() => loadStoryPage(1), 350), adminSearch = deb(() => loadAdmin(), 350), manageSearch = deb(() => loadManage(), 350);
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (id === 'bsort'){ B.sort = e.target.value; return loadBrowse(true); }
  if (id === 'bstatus'){ B.status = e.target.value; browseChips(); return loadBrowse(true); }
  if (id === 'blangsel'){ B.language = e.target.value; browseChips(); return loadBrowse(true); }
  if (id === 'bplatsel'){ B.platform = e.target.value; browseChips(); return loadBrowse(true); }
  if (id === 'epf'){ V.filter = e.target.value; return loadStoryPage(1); }
  if (id === 'apub'){ A.pub = e.target.value; return loadAdmin(); }
  if (id === 'aost'){ A.ostatus = e.target.value; return loadAdmin(); }
  if (id === 'planSort'){ localStorage.setItem('ajfm_plansort', e.target.value); try{ const pl = await api(`/api/story/${encodeURIComponent(V.id)}/plans?sort=${e.target.value}`); V.plan_cards = pl.plans; V.planSort = pl.sort; renderStory(); startPlanSlide(); }catch(err){ toast(errText(err)); } return; }
  if (id === 'fSeek'){ P.dragging = false; audio.currentTime = Number(e.target.value); }
  if (id === 'e_photo' && e.target.files[0]){ try{ E.photo = await downscale(e.target.files[0]); paintPhoto(); toast('Photo added'); }catch(err){ toast(err.message); } }
  if (id === 'm_file' && e.target.files[0]){ $('#m_data').value = await e.target.files[0].text(); toast('File loaded. Tap Check only first.'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'epJump') $('#epGo').click(); });
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#rMinus, #rPlus'); if (!b) return;
  const d = b.id === 'rPlus' ? 0.05 : -0.05; setRate(P.rate + d);
  clearInterval(window._rt); window._rt = setInterval(() => setRate(P.rate + d), 150);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearInterval(window._rt), true));
if (tg) tg.BackButton.onClick(goBack);

(function boot(){
  if (new URLSearchParams(location.search).get('open') === 'library') S.tab = 'library';
  api('/api/me').then(m => { S.admin = !!m.admin; $('#adminBtn').hidden = !S.admin; }).catch(() => {});
  loadCart();
  setTab(S.tab);
})();
</script>
</body>
</html>
