      confirmBtn.disabled = false;
      confirmBtn.textContent = "Delete Story";
      toast(err.message || "Delete failed.", "error");
    }
  });
}

/* ---- Admin: story editor (Step 1 + Step 2 plans) ---- */
function openStoryEditor(story, onSaved) {
  const isNew = !story;
  const data = story || {};

  const content = el("div");

  const form = el("div");
  content.appendChild(form);

  const fields = {};

  function textField(key, label, value, opts = {}) {
    const wrap = el("div", { class: "field" });
    wrap.appendChild(el("label", { text: label, attrs: { for: "f_" + key } }));
    const input = el(opts.multiline ? "textarea" : "input", {
      class: opts.multiline ? "textarea" : "input",
      id: "f_" + key,
      value: value != null ? String(value) : "",
      type: opts.type || "text",
      placeholder: opts.placeholder || ""
    });
    wrap.appendChild(input);
    if (opts.hint) wrap.appendChild(el("div", { class: "hint", text: opts.hint }));
    const err = el("div", { class: "field-error", hidden: true });
    wrap.appendChild(err);
    form.appendChild(wrap);
    fields[key] = { input, err, required: !!opts.required };
    return input;
  }

  function selectField(key, label, value, options) {
    const wrap = el("div", { class: "field" });
    wrap.appendChild(el("label", { text: label }));
    const sel = el("select", { class: "select" });
    for (const o of options) {
      const opt = el("option", { value: o.value, text: o.label });
      if (String(o.value) === String(value)) opt.selected = true;
      sel.appendChild(opt);
    }
    wrap.appendChild(sel);
    form.appendChild(wrap);
    fields[key] = { input: sel };
    return sel;
  }

  textField("title", "Story Name *", data.title, { required: true, placeholder: "e.g. The Midnight Express" });
  textField("cover_url", "Cover Image URL", data.cover_url || data.cover, { placeholder: "https://…" });
  selectField("status", "Story Status", data.status || "ongoing", [
    { value: "ongoing", label: "Ongoing" },
    { value: "completed", label: "Completed" }
  ]);
  textField("platform", "Platform", data.platform, { placeholder: "e.g. Telegram" });
  textField("genre", "Genre", data.genre, { placeholder: "e.g. Horror" });
  textField("language", "Language", data.language, { placeholder: "e.g. Hindi" });
  textField("voice_type", "Voice Type", data.voice_type, { placeholder: "e.g. Single Narrator" });
  textField("start_episode", "Starting Episode Number", data.start_episode, { type: "number" });
  textField("end_episode", "Ending Episode Number", data.end_episode, { type: "number" });
  textField("description", "Story Description", data.description, { multiline: true, placeholder: "Full description…" });

  // Plans section (Step 2) -- only for existing stories
  const plansSection = el("div", { class: "mt-16" });
  if (!isNew) {
    plansSection.appendChild(el("div", { class: "divider" }));
    plansSection.appendChild(el("div", { class: "section-title mb-8", text: "Payment Options" }));
    const plansHost = el("div");
    plansSection.appendChild(plansHost);
    plansSection.appendChild(el("button", {
      class: "btn btn-ghost btn-sm mt-8",
      text: "+ Add Plan",
      onClick: () => openPlanEditor(data.id, null, () => loadPlansAdmin(data.id, plansHost))
    }));
    loadPlansAdmin(data.id, plansHost);
    content.appendChild(plansSection);
  }

  const saveDraftBtn = el("button", { class: "btn btn-soft", text: isNew ? "Save Draft" : "Save" });
  const publishBtn = el("button", { class: "btn btn-primary", text: "Publish" });

  Overlay.open({
    title: isNew ? "New Story" : "Edit Story",
    content,
    footer: el("div", { class: "row", style: { width: "100%" } },
      el("button", { class: "btn btn-soft", text: "Cancel", onClick: () => Overlay.close() }),
      saveDraftBtn,
      publishBtn
    )
  });

  function collect() {
    let valid = true;
    for (const key of Object.keys(fields)) {
      const f = fields[key];
      if (f.err) f.err.hidden = true;
      if (f.input) f.input.style.borderColor = "";
    }
    const title = fields.title.input.value.trim();
    if (!title) {
      fields.title.err.textContent = "Story name is required.";
      fields.title.err.hidden = false;
      fields.title.input.style.borderColor = "var(--danger)";
      valid = false;
    }
    const start = fields.start_episode.input.value.trim();
    const end = fields.end_episode.input.value.trim();
    if (start && end && Number(start) > Number(end)) {
      fields.end_episode.err.textContent = "Ending episode must be greater than or equal to the starting episode.";
      fields.end_episode.err.hidden = false;
      fields.end_episode.input.style.borderColor = "var(--danger)";
      valid = false;
    }
    if (!valid) return null;

    return {
      id: data.id,
      title,
      cover_url: fields.cover_url.input.value.trim(),
      status: fields.status.input.value,
      platform: fields.platform.input.value.trim(),
      genre: fields.genre.input.value.trim(),
      language: fields.language.input.value.trim(),
      voice_type: fields.voice_type.input.value.trim(),
      start_episode: start ? Number(start) : null,
      end_episode: end ? Number(end) : null,
      description: fields.description.input.value.trim()
    };
  }

  async function save(publish, btn) {
    const payload = collect();
    if (!payload) {
      toast("Please fix the highlighted fields.", "error");
      return;
    }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Saving…";
    try {
      if (publish && !payload.id) {
        // Create first, then publish via the dedicated endpoint if the backend needs it.
        const res = await Api.post("/api/admin/story", Object.assign({}, payload, { published: true }), { dedupeKey: null });
        const created = (res && res.story) || res;
        if (created && created.id && created.published !== true) {
          try { await Api.post(`/api/admin/story/${encodeURIComponent(created.id)}/publish`, { published: true }, { dedupeKey: null }); } catch (_) {}
        }
      } else if (publish && payload.id) {
        await Api.post("/api/admin/story", payload, { dedupeKey: null });
        await Api.post(`/api/admin/story/${encodeURIComponent(payload.id)}/publish`, { published: true }, { dedupeKey: null });
      } else {
        await Api.post("/api/admin/story", payload, { dedupeKey: null });
      }
      Overlay.close();
      toast(publish ? "Story published." : "Story saved.", "success");
      if (onSaved) onSaved();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = originalText;
      toast(err.message || "Save failed.", "error", 5200);
    }
  }

  saveDraftBtn.addEventListener("click", () => save(false, saveDraftBtn));
  publishBtn.addEventListener("click", () => save(true, publishBtn));
}

async function loadPlansAdmin(storyId, host) {
  host.textContent = "";
  host.appendChild(el("div", { class: "sk sk-line", style: { height: "50px" } }));
  try {
    const data = await Api.get(`/api/admin/story/${encodeURIComponent(storyId)}/plans`, null, { dedupeKey: `plans:${storyId}` });
    const plans = (data && Array.isArray(data.items)) ? data.items : (Array.isArray(data) ? data : []);
    host.textContent = "";
    if (!plans.length) {
      host.appendChild(el("div", { class: "tiny muted", text: "No payment plans configured." }));
      return;
    }
    for (const p of plans) {
      const card = el("div", { class: "plan-card", style: { marginBottom: "8px" } });
      const top = el("div", { class: "plan-top" });
      top.appendChild(el("div", { class: "plan-name", text: p.name || planTypeLabel(p.type) }));
      top.appendChild(el("div", { class: "plan-price", text: p.price_display || formatPrice(p) }));
      card.appendChild(top);
      const tags = el("div", { class: "plan-tags" });
      tags.appendChild(el("span", { class: "chip" + (p.enabled === false ? " plain" : ""), text: p.enabled === false ? "Disabled" : "Enabled" }));
      if (p.episode_start != null && p.episode_end != null) {
        tags.appendChild(el("span", { class: "chip plain", text: `Ep ${p.episode_start}–${p.episode_end}` }));
      }
      if (p.rental_days) tags.appendChild(el("span", { class: "chip plain", text: `${p.rental_days}d` }));
      card.appendChild(tags);
      card.appendChild(el("button", {
        class: "btn btn-soft btn-sm mt-8",
        text: "Edit Plan",
        onClick: () => openPlanEditor(storyId, p, () => loadPlansAdmin(storyId, host))
      }));
      host.appendChild(card);
    }
  } catch (err) {
    host.textContent = "";
    host.appendChild(el("div", { class: "row" },
      el("div", { class: "tiny muted grow", text: err.message || "Could not load plans." }),
      el("button", { class: "btn btn-soft btn-sm", text: "Retry", onClick: () => loadPlansAdmin(storyId, host) })
    ));
  }
}

function openPlanEditor(storyId, plan, onSaved) {
  const p = plan || {};
  const content = el("div");

  const nameInput = el("input", { class: "input", value: p.name || "", placeholder: "e.g. Full Story" });
  const typeSelect = el("select", { class: "select" });
  for (const o of [
    { v: "rent", l: "Rent (time-limited)" },
    { v: "full_story", l: "Buy Full Story" },
    { v: "episode_range", l: "Buy Episode Range" },
    { v: "episode_pack", l: "Episode Pack" }
  ]) {
    const opt = el("option", { value: o.v, text: o.l });
    if (String(p.type) === o.v) opt.selected = true;
    typeSelect.appendChild(opt);
  }
  const priceInput = el("input", { class: "input", type: "number", step: "0.01", value: p.price != null ? p.price : "", placeholder: "0.00" });
  const currencyInput = el("input", { class: "input", value: p.currency || "", placeholder: "e.g. INR" });
  const startInput = el("input", { class: "input", type: "number", value: p.episode_start != null ? p.episode_start : "", placeholder: "Start" });
  const endInput = el("input", { class: "input", type: "number", value: p.episode_end != null ? p.episode_end : "", placeholder: "End" });
  const daysInput = el("input", { class: "input", type: "number", value: p.rental_days != null ? p.rental_days : "", placeholder: "Days" });
  const enabledInput = el("input", { type: "checkbox" });

  const mk = (label, node, hint) => {
    const f = el("div", { class: "field" });
    f.appendChild(el("label", { text: label }));
    f.appendChild(node);
    if (hint) f.appendChild(el("div", { class: "hint", text: hint }));
    return f;
  };

  content.appendChild(mk("Plan Name *", nameInput));
  content.appendChild(mk("Plan Type", typeSelect));
  content.appendChild(el("div", { class: "grid-2" },
    mk("Price *", priceInput),
    mk("Currency", currencyInput)
  ));
  content.appendChild(el("div", { class: "grid-2" },
    mk("Episode Start", startInput),
    mk("Episode End", endInput)
  ));
  content.appendChild(mk("Rental Duration (days)", daysInput, "Leave empty for non-rental plans."));

  const enableWrap = el("label", { class: "row", style: { gap: "9px", marginBottom: "14px", cursor: "pointer" } });
  enabledInput.checked = p.enabled !== false;
  enableWrap.appendChild(enabledInput);
  enableWrap.appendChild(el("span", { style: { fontSize: "13px" }, text: "Enabled (visible to users)" }));
  content.appendChild(enableWrap);

  const saveBtn = el("button", { class: "btn btn-primary", text: "Save Plan" });
  Overlay.open({
    title: plan ? "Edit Plan" : "New Plan",
    content,
    footer: el("div", { class: "row", style: { width: "100%" } },
      el("button", { class: "btn btn-soft", text: "Cancel", onClick: () => Overlay.close() }),
      saveBtn
    )
  });

  saveBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const price = priceInput.value.trim();
    if (!name || price === "") {
      toast("Plan name and price are required.", "error");
      return;
    }
    const payload = {
      id: p.id,
      name,
      type: typeSelect.value,
      price: Number(price),
      currency: currencyInput.value.trim(),
      episode_start: startInput.value.trim() ? Number(startInput.value) : null,
      episode_end: endInput.value.trim() ? Number(endInput.value) : null,
      rental_days: daysInput.value.trim() ? Number(daysInput.value) : null,
      enabled: enabledInput.checked
    };
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      await Api.post(`/api/admin/story/${encodeURIComponent(storyId)}/plans`, payload, { dedupeKey: null });
      Overlay.close();
      toast("Plan saved.", "success");
      if (onSaved) onSaved();
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Plan";
      toast(err.message || "Could not save the plan.", "error");
    }
  });
}

/* ---- Admin: episode import ---- */
function renderAdminImport(host) {
  host.textContent = "";

  host.appendChild(el("div", {
    class: "tiny muted mb-16",
    style: { lineHeight: "1.55" },
    text: "Link validation, retrieval and import are performed by the backend. This app only submits the range and polls job status."
  }));

  const storyIdInput = el("input", { class: "input", placeholder: "Story ID" });
  const firstInput = el("input", { class: "input", placeholder: "https://t.me/channel/123" });
  const lastInput = el("input", { class: "input", placeholder: "https://t.me/channel/456" });

  const mk = (label, node, hint) => {
    const f = el("div", { class: "field" });
    f.appendChild(el("label", { text: label }));
    f.appendChild(node);
    if (hint) f.appendChild(el("div", { class: "hint", text: hint }));
    return f;
  };

  host.appendChild(mk("Story ID *", storyIdInput));
  host.appendChild(mk("First Telegram Episode Link *", firstInput));
  host.appendChild(mk("Last Telegram Episode Link *", lastInput));

  const actions = el("div", { class: "row wrap mb-16" });
  const validateBtn = el("button", { class: "btn btn-soft btn-sm", text: "Validate Links" });
  const previewBtn = el("button", { class: "btn btn-ghost btn-sm", text: "Preview Import" });
  const confirmBtn = el("button", { class: "btn btn-primary btn-sm", text: "Confirm Import" });
  actions.appendChild(validateBtn);
  actions.appendChild(previewBtn);
  actions.appendChild(confirmBtn);
  host.appendChild(actions);

  const resultHost = el("div");
  host.appendChild(resultHost);

  function collect(mode) {
    const storyId = storyIdInput.value.trim();
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    if (!storyId || !first || !last) {
      toast("Story ID and both links are required.", "error");
      return null;
    }
    return { story_id: storyId, first_link: first, last_link: last, mode };
  }

  async function callParse(mode, btn) {
    const payload = collect(mode);
    if (!payload) return;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Working…";
    resultHost.textContent = "";
    resultHost.appendChild(el("div", { class: "center-pad" }, el("div", { class: "spinner" })));
    try {
      const data = await Api.post("/api/admin/parse", payload, { dedupeKey: null });
      resultHost.textContent = "";
      resultHost.appendChild(renderImportPreview(data, mode));
    } catch (err) {
      resultHost.textContent = "";
      resultHost.appendChild(errorBox(err.message, () => callParse(mode, btn)));
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  validateBtn.addEventListener("click", () => callParse("validate", validateBtn));
  previewBtn.addEventListener("click", () => callParse("preview", previewBtn));

  confirmBtn.addEventListener("click", async () => {
    const payload = collect("import");
    if (!payload) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Starting…";
    try {
      const data = await Api.post("/api/admin/import", {
        story_id: payload.story_id,
        first_link: payload.first_link,
        last_link: payload.last_link
      }, { dedupeKey: null });
      const job = (data && data.job) || data;
      toast("Import job started.", "success");
      resultHost.textContent = "";
      resultHost.appendChild(renderImportJob(job));
      if (job && (job.id || job.job_id)) {
        pollImportJob(job.id || job.job_id, resultHost);
      }
    } catch (err) {
      toast(err.message || "Could not start the import.", "error", 5200);
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Confirm Import";
    }
  });
}

function renderImportPreview(data, mode) {
  const wrap = el("div");
  const title = mode === "validate" ? "Validation Result" : "Import Preview";
  wrap.appendChild(el("div", { class: "section-title mb-8", text: title }));

  if (!data || typeof data !== "object") {
    wrap.appendChild(el("div", { class: "muted tiny", text: "No details returned." }));
    return wrap;
  }

  const grid = el("div", { class: "grid-2 mb-16" });
  const addTile = (k, v) => {
    if (v === undefined || v === null) return;
    grid.appendChild(el("div", { class: "stat-tile" },
      el("div", { class: "v", text: String(v) }),
      el("div", { class: "k", text: k })
    ));
  };
  addTile("Detected", data.detected_count);
  addTile("Duplicates", data.duplicate_count);
  addTile("Missing Media", data.missing_media_count);
  addTile("Mapping Issues", data.mapping_issue_count);
  wrap.appendChild(grid);

  if (Array.isArray(data.episodes) && data.episodes.length) {
    wrap.appendChild(el("div", { class: "tiny muted mb-8", text: `Preview (${Math.min(20, data.episodes.length)} of ${data.episodes.length})` }));
    for (const e of data.episodes.slice(0, 20)) {
      wrap.appendChild(el("div", {
        style: { padding: "8px 10px", borderBottom: "1px solid rgba(255,255,255,.05)", fontSize: "12.5px" }
      },
        el("div", { text: `${e.episode_number != null ? e.episode_number + ". " : ""}${e.title || e.episode_title || "Untitled"}` }),
        (e.original_filename ? el("div", { class: "tiny muted", text: e.original_filename }) : null),
        (e.issue ? el("div", { class: "tiny", style: { color: "var(--warn)" }, text: e.issue }) : null)
      ));
    }
  }

  if (Array.isArray(data.errors) && data.errors.length) {
    wrap.appendChild(el("div", { class: "section-title mb-8 mt-16", text: "Errors" }));
    for (const e of data.errors.slice(0, 20)) {
      wrap.appendChild(el("div", { class: "tiny", style: { color: "var(--danger)", padding: "3px 0" }, text: typeof e === "string" ? e : (e.message || JSON.stringify(e)) }));
    }
  }

  return wrap;
}

function renderImportJob(job) {
  const wrap = el("div", { class: "order-card" });
  const id = job.id || job.job_id;

  const top = el("div", { class: "order-top" });
  top.appendChild(el("div", { class: "order-story", text: "Import Job" }));
  top.appendChild(el("span", { class: `status-pill ${job.status === "completed" ? "status-approved" : job.status === "failed" ? "status-rejected" : "status-pending"}`, text: job.status || "running" }));
  wrap.appendChild(top);

  wrap.appendChild(el("div", { class: "order-id", text: "Job " + (id || "--") }));

  const grid = el("div", { class: "grid-2 mt-8" });
  const addTile = (k, v) => {
    if (v === undefined || v === null) return;
    grid.appendChild(el("div", { class: "stat-tile" },
      el("div", { class: "v", text: String(v) }),
      el("div", { class: "k", text: k })
    ));
  };
  addTile("Total", job.total);
  addTile("Processed", job.processed);
  addTile("Imported", job.imported != null ? job.imported : job.successful);
  addTile("Duplicates", job.duplicates);
  addTile("Missing", job.missing_media);
  addTile("Errors", job.errors != null && typeof job.errors === "number" ? job.errors : (Array.isArray(job.errors) ? job.errors.length : undefined));
  wrap.appendChild(grid);

  if (job.error_message) {
    wrap.appendChild(el("div", { class: "tiny", style: { color: "var(--danger)", marginTop: "8px" }, text: job.error_message }));
  }

  wrap.dataset.jobId = id || "";
  return wrap;
}

function pollImportJob(jobId, host) {
  let attempts = 0;
  const maxAttempts = 120;
  const tick = async () => {
    attempts++;
    if (attempts > maxAttempts) return;
    try {
      const data = await Api.get(`/api/admin/import/${encodeURIComponent(jobId)}`, null, { dedupeKey: null });
      const job = (data && data.job) || data;
      const existing = host.querySelector(`[data-job-id="${CSS.escape(String(jobId))}"]`);
      const fresh = renderImportJob(job);
      if (existing) existing.replaceWith(fresh);
      else host.appendChild(fresh);

      const status = String(job.status || "").toLowerCase();
      if (status === "completed" || status === "failed" || status === "cancelled") {
        if (status === "completed") toast("Import completed.", "success");
        else toast("Import finished with issues.", "error");
        return;
      }
      setTimeout(tick, 4000);
    } catch (_) {
      setTimeout(tick, 6000);
    }
  };
  setTimeout(tick, 2500);
}

/* ---- Admin: order review ---- */
async function renderAdminOrders(host) {
  host.textContent = "";
  host.appendChild(el("div", { class: "center-pad" }, el("div", { class: "spinner" })));

  try {
    const data = await Api.get("/api/admin/orders", { status: "pending" }, { dedupeKey: "admin:orders" });
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    host.textContent = "";

    host.appendChild(el("div", {
      class: "tiny muted mb-16",
      style: { lineHeight: "1.55" },
      text: "Payment approval is performed by an authorized administrator through the bot or the backend. This list is read-only."
    }));

    if (!items.length) {
      host.appendChild(emptyBox("No pending orders", "There are no orders awaiting review."));
      return;
    }

    for (const o of items) {
      const card = OrderCard(o);
      // Admins do not get approval buttons here -- approval happens via the bot.
      const note = el("div", {
        class: "tiny muted",
        style: { marginTop: "6px" },
        text: "Review and approve this order in the Telegram bot / backend admin flow."
      });
      card.appendChild(note);
      host.appendChild(card);
    }
  } catch (err) {
    host.textContent = "";
    host.appendChild(errorBox(err.message, () => renderAdminOrders(host)));
  }
}

/* ------------------------------------------------------------
   17. AUDIO PLAYER
   ------------------------------------------------------------ */
const Player = (() => {
  const audio = new Audio();
  audio.preload = "metadata";
  audio.crossOrigin = "anonymous";

  let rafId = null;
  let saveTimer = null;

  function updateUI() {
    const p = State.player;

    const mini = $("#mini-player");
    if (mini) mini.hidden = !p.episodeId;

    const miniTitle = $("#mini-title");
    const miniSub = $("#mini-sub");
    if (miniTitle) miniTitle.textContent = p.episodeTitle || "--";
    if (miniSub) miniSub.textContent = p.storyTitle || "--";

    const miniCover = $("#mini-cover");
    if (miniCover) {
      miniCover.textContent = "";
      if (p.cover) {
        const img = el("img", { alt: "", attrs: { referrerpolicy: "no-referrer" } });
        img.addEventListener("error", () => img.remove());
        img.src = p.cover;
        miniCover.appendChild(img);
      } else {
        miniCover.appendChild(el("div", { style: { width: "100%", height: "100%", background: "var(--bg-3)" } }));
      }
    }

    const pct = p.duration > 0 ? (p.position / p.duration) * 100 : 0;
    const fill = $("#mini-progress-fill");
    if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + "%";

    // Play/pause icon in mini player
    const miniPlayIcon = $("#mini-play-icon");
    if (miniPlayIcon) {
      miniPlayIcon.innerHTML = p.isPlaying
        ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
        : '<path d="M8 5.2v13.6L19 12z"/>';
    }
    const miniPlayBtn = $("#mini-play");
    if (miniPlayBtn) miniPlayBtn.setAttribute("aria-label", p.isPlaying ? "Pause" : "Play");

    // Expanded player
    const sheet = $("#player-sheet");
    if (sheet && sheet.classList.contains("show")) renderExpandedPlayerInto(sheet);
  }

  function renderExpandedPlayerInto(sheet) {
    const p = State.player;
    const body = sheet.querySelector(".sheet-body");
    if (!body) return;
    body.textContent = "";

    // Artwork
    const art = el("div", { class: "player-art" });
    if (p.cover) {
      const img = el("img", { alt: "", attrs: { referrerpolicy: "no-referrer" } });
      img.addEventListener("error", () => { img.remove(); });
      img.src = p.cover;
      art.appendChild(img);
    }
    body.appendChild(art);

    // Titles
    const titles = el("div", { class: "player-titles" });
    titles.appendChild(el("div", { class: "player-ep", text: p.episodeTitle || "--" }));
    const sub = [p.storyTitle, p.episodeNumber != null ? `Episode ${p.episodeNumber}` : null]
      .filter(Boolean).join(" • ");
    if (sub) titles.appendChild(el("div", { class: "player-story", text: sub }));
    body.appendChild(titles);

    // Buffering indicator
    if (p.isBuffering) {
      body.appendChild(el("div", { class: "buffering" },
        el("div", { class: "spinner", style: { width: "14px", height: "14px", borderWidth: "2px" } }),
        "Buffering…"
      ));
    }

    // Seek
    const seekWrap = el("div", { class: "seek-wrap" });
    const currentEl = el("span", { class: "seek-time", text: formatDuration(p.position) });
    const range = el("input", {
      type: "range", min: "0", max: "1000", value: String(p.duration > 0 ? (p.position / p.duration) * 1000 : 0),
      attrs: { "aria-label": "Seek" }
    });
    const totalEl = el("span", { class: "seek-time", text: formatDuration(p.duration) });

    let seeking = false;
    range.addEventListener("input", () => { seeking = true; });
    range.addEventListener("change", () => {
      if (p.duration > 0) {
        const pos = (Number(range.value) / 1000) * p.duration;
        try { audio.currentTime = pos; } catch (_) {}
        State.player.position = pos;
      }
      seeking = false;
    });
    seekWrap.appendChild(currentEl);
    seekWrap.appendChild(range);
    seekWrap.appendChild(totalEl);
    body.appendChild(seekWrap);

    // Controls
    const controls = el("div", { class: "player-controls" });

    controls.appendChild(el("button", {
      class: "pc-btn", attrs: { "aria-label": "Previous episode" },
      disabled: !hasPrev(),
      onClick: () => playPrevious()
    }, svg('<path d="M18 6l-8 6 8 6z"/><path d="M7 5v14"/>', 22, { fill: "currentColor", stroke: "currentColor" })));

    controls.appendChild(el("button", {
      class: "pc-btn", attrs: { "aria-label": "Skip back 15 seconds" },
      onClick: () => seekBy(-15)
    }, svg('<path d="M11 5L6 9l5 4"/><path d="M6 9h7a6 6 0 110 12h-3"/>', 22)));

    const mainBtn = el("button", {
      class: "pc-btn pc-main",
      attrs: { "aria-label": p.isPlaying ? "Pause" : "Play" },
      onClick: togglePlay
    });
    mainBtn.appendChild(p.isPlaying
      ? svg('<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>', 28, { fill: "currentColor", stroke: "none" })
      : svg('<path d="M8 5.2v13.6L19 12z"/>', 30, { fill: "currentColor", stroke: "none" }));
    controls.appendChild(mainBtn);

    controls.appendChild(el("button", {
      class: "pc-btn", attrs: { "aria-label": "Skip forward 15 seconds" },
      onClick: () => seekBy(15)
    }, svg('<path d="M13 5l5 4-5 4"/><path d="M18 9h-7a6 6 0 100 12h3"/>', 22)));

    controls.appendChild(el("button", {
      class: "pc-btn", attrs: { "aria-label": "Next episode" },
      disabled: !hasNext(),
      onClick: () => playNext()
    }, svg('<path d="M6 6l8 6-8 6z"/><path d="M17 5v14"/>', 22, { fill: "currentColor", stroke: "currentColor" })));

    body.appendChild(controls);

    // Extras
    const extras = el("div", { class: "player-extras" });

    const speedBtn = el("button", { class: "extra-btn" + (p.rate !== 1 ? " active" : "") });
    speedBtn.appendChild(svg('<path d="M12 3a9 9 0 109 9"/><path d="M12 7v5l3 2"/>', 20));
    speedBtn.appendChild(el("span", { text: p.rate === 1 ? "1×" : p.rate + "×" }));
    speedBtn.addEventListener("click", () => {
      const rates = [1, 1.25, 1.5, 1.75, 2, 0.75];
      const idx = rates.indexOf(p.rate);
      const next = rates[(idx + 1) % rates.length];
      State.player.rate = next;
      audio.playbackRate = next;
      saveUiPrefs();
      renderExpandedPlayerInto(sheet);
    });
    extras.appendChild(speedBtn);

    const sleepBtn = el("button", { class: "extra-btn" + (p.sleepAt ? " active" : "") });
    sleepBtn.appendChild(svg('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>', 20));
    sleepBtn.appendChild(el("span", { text: p.sleepAt ? formatDuration(Math.max(0, Math.round((p.sleepAt - Date.now()) / 1000))) : "Sleep" }));
    sleepBtn.addEventListener("click", () => openSleepTimer(sheet));
    extras.appendChild(sleepBtn);

    if (p.queue && p.queue.length > 1) {
      const queueBtn = el("button", { class: "extra-btn" });
      queueBtn.appendChild(svg('<path d="M4 6h16M4 12h16M4 18h10"/>', 20));
      queueBtn.appendChild(el("span", { text: `Queue ${p.queueIndex + 1}/${p.queue.length}` }));
      queueBtn.addEventListener("click", () => openQueueSheet(sheet));
      extras.appendChild(queueBtn);
    }

    body.appendChild(extras);

    // Keep seek UI in sync while playing (without rebuilding the whole sheet)
    if (!seeking) {
      const pct = p.duration > 0 ? (p.position / p.duration) : 0;
      range.value = String(pct * 1000);
      currentEl.textContent = formatDuration(p.position);
      totalEl.textContent = formatDuration(p.duration);
    }

    // Patch the rAF loop to refresh these nodes.
    sheet._liveNodes = { range, currentEl, totalEl };
  }

  function syncLiveNodes() {
    const sheet = $("#player-sheet");
    if (!sheet || !sheet.classList.contains("show")) return;
    const nodes = sheet._liveNodes;
    if (!nodes) return;
    const p = State.player;
    if (document.activeElement === nodes.range) return;
    const pct = p.duration > 0 ? (p.position / p.duration) : 0;
    nodes.range.value = String(pct * 1000);
    nodes.currentEl.textContent = formatDuration(p.position);
    nodes.totalEl.textContent = formatDuration(p.duration);
  }

  function hasPrev() {
    const p = State.player;
    return p.queue && p.queueIndex > 0;
  }
  function hasNext() {
    const p = State.player;
    return p.queue && p.queueIndex >= 0 && p.queueIndex < p.queue.length - 1;
  }

  function togglePlay() {
    const p = State.player;
    if (!p.episodeId) return;
    if (audio.paused) {
      audio.play().catch(err => {
        State.player.error = err && err.message ? err.message : "Playback was blocked.";
        toast("Tap play again to start audio.", "info");
        updateUI();
      });
    } else {
      audio.pause();
    }
  }

  function seekBy(delta) {
    if (!audio.duration || !isFinite(audio.duration)) return;
    try {
      audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
    } catch (_) {}
  }

  /** Authorized playback start: always request a fresh stream URL from the backend. */
  async function playEpisode(episodeRef) {
    const p = State.player;
    if (!episodeRef || !episodeRef.episodeId) return;

    // Same episode -- just toggle.
    if (p.episodeId === episodeRef.episodeId) {
      if (audio.src) { togglePlay(); return; }
    }

    await saveProgress(true);

    p.error = null;
    p.isBuffering = true;
    p.episodeId = episodeRef.episodeId;
    p.episodeNumber = episodeRef.episodeNumber != null ? episodeRef.episodeNumber : null;
    p.episodeTitle = episodeRef.episodeTitle || "Episode";
    p.storyId = episodeRef.storyId || null;
    p.storyTitle = episodeRef.storyTitle || "";
    p.cover = episodeRef.cover || p.cover || "";
    p.position = 0;
    p.duration = Number(episodeRef.duration) || 0;
    updateUI();

    try {
      const data = await Api.post(`/api/play/${encodeURIComponent(episodeRef.episodeId)}`, {}, { dedupeKey: null });
      const url = data && (data.stream_url || data.url || data.audio_url);
      if (!url) {
        throw new ApiError("This episode is not available for playback.", { kind: "notfound" });
      }
      const episode = data.episode || {};
      if (episode.episode_title || episode.title) {
        State.player.episodeTitle = episodeDisplayTitle(episode);
      }
      if (data.story && data.story.title) {
        State.player.storyTitle = data.story.title;
      }

      audio.src = url;
      audio.playbackRate = State.player.rate;
      audio.load();

      const startAt = Number(data.start_position || data.resume_position || 0);
      if (isFinite(startAt) && startAt > 0) {
        audio.addEventListener("loadedmetadata", function once() {
          audio.removeEventListener("loadedmetadata", once);
          try { audio.currentTime = startAt; } catch (_) {}
        });
      }

      await audio.play().catch(err => {
        // Autoplay might be blocked; leave the UI in a paused state.
        if (err && err.name === "NotAllowedError") {
          toast("Tap play to begin playback.", "info");
        } else if (err) {
          toast("Playback could not start.", "error");
        }
      });

      p.isBuffering = false;
      updateUI();
      startProgressTimer();
    } catch (err) {
      p.isBuffering = false;
      p.error = err.message;
      updateUI();
      toast(err.message || "This episode could not be played.", "error", 5200);
    }
  }

  function playNext() {
    const p = State.player;
    if (!hasNext()) return;
    p.queueIndex += 1;
    playEpisode(p.queue[p.queueIndex]);
  }

  function playPrevious() {
    const p = State.player;
    if (!hasPrev()) return;
    p.queueIndex -= 1;
    playEpisode(p.queue[p.queueIndex]);
  }

  function setQueue(queue, index) {
    State.player.queue = Array.isArray(queue) ? queue : [];
    State.player.queueIndex = typeof index === "number" ? index : -1;
  }

  /** Persist progress to the backend. Throttled by the caller. */
  async function saveProgress(force = false) {
    const p = State.player;
    if (!p.episodeId) return;
    if (!p.duration || !isFinite(p.duration)) return;

    const now = Date.now();
    if (!force && now - p.lastSavedAt < CONFIG.PROGRESS_SAVE_INTERVAL_MS) return;
    p.lastSavedAt = now;

    const payload = {
      episode_id: p.episodeId,
      position: Math.floor(p.position),
      duration: Math.floor(p.duration),
      completed: p.duration > 0 && (p.position / p.duration) > 0.97
    };

    // Capture the episode id so a late response can never corrupt a newer episode.
    const forEpisode = p.episodeId;

    try {
      await Api.post("/api/progress", payload, { dedupeKey: null });
    } catch (err) {
      // Silent failure -- progress will be retried on the next interval.
      if (forEpisode === State.player.episodeId) {
        console.warn("[progress] save failed:", err.message);
      }
    }
  }

  function startProgressTimer() {
    if (saveTimer) return;
    saveTimer = setInterval(() => {
      if (State.player.isPlaying) saveProgress(false);
    }, CONFIG.PROGRESS_SAVE_INTERVAL_MS);
  }

  function stopProgressTimer() {
    if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }
  }

  function openExpandedPlayer() {
    const sheet = Overlay.open({
      title: "Now Playing",
      kind: "sheet",
      content: el("div", { style: { display: "none" } }),
      onClose: () => { /* keep playback running */ }
    });
    sheet.panel.id = "player-sheet";
    renderExpandedPlayerInto(sheet.panel);
    // rAF loop to keep the seek bar smooth while the sheet is open.
    const loop = () => {
      syncLiveNodes();
      if (sheet.panel.isConnected) rafId = requestAnimationFrame(loop);
      else rafId = null;
    };
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function openSleepTimer(sheet) {
    const content = el("div");
    const p = State.player;
    if (p.sleepAt) {
      content.appendChild(el("p", { style: { fontSize: "13.5px", marginBottom: "14px" },
        text: "A sleep timer is active. It will pause playback when it ends." }));
      content.appendChild(el("button", {
        class: "btn btn-soft btn-block", text: "Cancel Sleep Timer",
        onClick: () => { cancelSleep(); Overlay.close(); openExpandedPlayer(); }
      }));
      Overlay.open({ title: "Sleep Timer", content });
      return;
    }

    content.appendChild(el("p", { class: "tiny muted mb-16", text: "Playback will pause when the timer ends." }));
    const options = [10, 15, 30, 45, 60, 90];
    const list = el("div", { class: "grid-2" });
    for (const mins of options) {
      list.appendChild(el("button", {
        class: "btn btn-soft", text: `${mins} min`,
        onClick: () => {
          setSleep(mins);
          Overlay.close();
          openExpandedPlayer();
        }
      }));
    }
    content.appendChild(list);
    Overlay.open({ title: "Sleep Timer", content });
  }

  function setSleep(minutes) {
    cancelSleep();
    const ms = minutes * 60 * 1000;
    State.player.sleepAt = Date.now() + ms;
    State.player.sleepTimerId = setTimeout(() => {
      audio.pause();
      State.player.sleepAt = null;
      State.player.sleepTimerId = null;
      toast("Sleep timer ended. Playback paused.", "info");
      updateUI();
    }, ms);
    toast(`Sleep timer set for ${minutes} minutes.`, "success");
  }

  function cancelSleep() {
    if (State.player.sleepTimerId) {
      clearTimeout(State.player.sleepTimerId);
      State.player.sleepTimerId = null;
    }
    State.player.sleepAt = null;
  }

  function openQueueSheet(parentSheet) {
    const content = el("div");
    const p = State.player;
    p.queue.forEach((item, idx) => {
      const row = el("button", {
        class: "story-row",
        style: { marginBottom: "8px", borderColor: idx === p.queueIndex ? "var(--gold)" : null },
        onClick: () => {
          p.queueIndex = idx;
          playEpisode(p.queue[idx]);
          Overlay.close();
          openExpandedPlayer();
        }
      });
      const body = el("div", { class: "body" });
      body.appendChild(el("div", { class: "title", text: item.episodeTitle || `Episode ${item.episodeNumber || ""}` }));
      body.appendChild(el("div", { class: "tiny muted", text: item.locked ? "Locked" : "Ready" }));
      row.appendChild(body);
      content.appendChild(row);
    });
    Overlay.open({ title: "Queue", content });
  }

  /* --- Audio element event wiring (registered once) --- */
  audio.addEventListener("loadedmetadata", () => {
    if (isFinite(audio.duration)) State.player.duration = audio.duration;
    updateUI();
  });

  audio.addEventListener("timeupdate", () => {
    State.player.position = audio.currentTime || 0;
    if (isFinite(audio.duration)) State.player.duration = audio.duration;
    updateUI();
  });

  audio.addEventListener("play", () => {
    State.player.isPlaying = true;
    State.player.isBuffering = false;
    updateUI();
    startProgressTimer();
  });

  audio.addEventListener("pause", () => {
    State.player.isPlaying = false;
    updateUI();
    saveProgress(true);
  });

  audio.addEventListener("waiting", () => { State.player.isBuffering = true; updateUI(); });
  audio.addEventListener("playing", () => { State.player.isBuffering = false; updateUI(); });
  audio.addEventListener("canplay", () => { State.player.isBuffering = false; updateUI(); });

  audio.addEventListener("ended", async () => {
    State.player.isPlaying = false;
    State.player.position = State.player.duration;
    updateUI();
    await saveProgress(true);

    if (hasNext()) {
      const next = State.player.queue[State.player.queueIndex + 1];
      // Automatic next episode performs a fresh backend authorization check.
      if (next && !next.locked) {
        State.player.queueIndex += 1;
        playEpisode(next);
        return;
      }
    }
    toast("Episode finished.", "info");
  });

  audio.addEventListener("error", () => {
    State.player.isBuffering = false;
    State.player.isPlaying = false;
    const code = audio.error ? audio.error.code : 0;
    let msg = "Playback error.";
    if (code === 1) msg = "Playback was aborted.";
    else if (code === 2) msg = "A network error interrupted playback.";
    else if (code === 3) msg = "This audio file could not be decoded.";
    else if (code === 4) msg = "This audio format is not supported, or the link expired.";
    State.player.error = msg;
    updateUI();
    toast(msg, "error", 5000);
  });

  /* --- Lifecycle: save progress when the app is backgrounded --- */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") saveProgress(true);
  });
  window.addEventListener("pagehide", () => { saveProgress(true); });

  return {
    playEpisode, togglePlay, playNext, playPrevious, setQueue,
    saveProgress, updateUI, openExpandedPlayer, seekBy,
    get audio() { return audio; },
    stop() {
      stopProgressTimer();
      cancelSleep();
      try { audio.pause(); audio.removeAttribute("src"); audio.load(); } catch (_) {}
      State.player.episodeId = null;
      State.player.isPlaying = false;
      updateUI();
    }
  };
})();

/* Legacy-compatible wrapper used by views. */
function playEpisode(ref) { return Player.playEpisode(ref); }

/* ------------------------------------------------------------
   18. UI PREFERENCES (non-sensitive only)
   ------------------------------------------------------------ */
function saveUiPrefs() {
  try {
    localStorage.setItem("ajfm.ui.prefs", JSON.stringify({
      rate: State.player.rate,
      discoverSort: State.discover.sort
    }));
  } catch (_) {}
}

function loadUiPrefs() {
  try {
    const raw = localStorage.getItem("ajfm.ui.prefs");
    if (!raw) return;
    const prefs = JSON.parse(raw);
    if (prefs && typeof prefs.rate === "number" && prefs.rate >= 0.5 && prefs.rate <= 3) {
      State.player.rate = prefs.rate;
    }
    if (prefs && typeof prefs.discoverSort === "string") {
      State.discover.sort = prefs.discoverSort;
    }
  } catch (_) {}
}

/* ------------------------------------------------------------
   19. HEADER / GLOBAL EVENT WIRING
   ------------------------------------------------------------ */
function updateHeaderIndicators() {
  const dot = $("#header-account-dot");
  if (!dot) return;
  const pending = Number(State.counts.pending_orders) || 0;
  dot.hidden = pending <= 0;
}

function wireHeader() {
  const searchBtn = $("#btn-header-search");
  if (searchBtn) {
    searchBtn.addEventListener("click", () => {
      TG.haptic("light");
      navigate("discover");
      setTimeout(() => {
        const input = $("#view-root input[type=search]");
        if (input) input.focus();
      }, 120);
    });
  }

  const accountBtn = $("#btn-header-account");
  if (accountBtn) {
    accountBtn.addEventListener("click", () => {
      TG.haptic("light");
      navigate("account");
    });
  }
}

function wireMiniPlayer() {
  const mini = $("#mini-player");
  if (!mini) return;

  const expandBtn = $("#mini-expand");
  if (expandBtn) {
    expandBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      Player.openExpandedPlayer();
    });
  }

  const playBtn = $("#mini-play");
  if (playBtn) {
    playBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      TG.haptic("light");
      Player.togglePlay();
    });
  }

  const backBtn = $("#mini-skip-back");
  if (backBtn) {
    backBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      Player.seekBy(-15);
    });
  }

  mini.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    Player.openExpandedPlayer();
  });

  mini.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      Player.openExpandedPlayer();
    }
  });
  mini.setAttribute("tabindex", "0");
  mini.setAttribute("role", "button");
}

/* ------------------------------------------------------------
   20. INITIALIZATION
   ------------------------------------------------------------ */
function showBootError(title, message, actions) {
  const boot = $("#boot");
  const msg = $("#boot-msg");
  const spinner = $("#boot-spinner");
  const actionsHost = $("#boot-actions");
  if (!boot) return;
  boot.hidden = false;
  $("#app").setAttribute("aria-hidden", "true");
  if (spinner) spinner.style.display = "none";
  if (msg) msg.textContent = message || "";
  const titleEl = boot.querySelector(".boot-title");
  if (titleEl) titleEl.textContent = title || "AJ FM Stories Premium";
  if (actionsHost) {
    actionsHost.textContent = "";
    (actions || []).forEach(a => {
      actionsHost.appendChild(el("button", {
        class: "btn " + (a.primary ? "btn-primary" : "btn-ghost") + " mt-8",
        text: a.label,
        onClick: a.onClick
      }));
    });
  }
}

function hideBoot() {
  const boot = $("#boot");
  if (boot) boot.hidden = true;
  $("#app").removeAttribute("aria-hidden");
}

async function refreshMe() {
  const data = await Api.get("/api/me", null, { dedupeKey: "me", allowRetry: false });
  State.user = (data && data.user) || (TG.safeUser() || null);
  State.isAdmin = !!(data && data.is_admin === true);
  State.counts = (data && data.counts) || {};
  updateHeaderIndicators();
  renderBottomNav();
  return data;
}

async function bootstrap() {
  loadUiPrefs();

  // 1. Initialize Telegram
  const tgState = TG.init();

  // 2. Environment gate
  if (!tgState.insideTelegram && !CONFIG.ENABLE_DEMO_MODE) {
    showBootError(
      "Open in Telegram",
      "This app must be opened from the AJ FM Stories Premium bot inside Telegram. " +
      "If you are the developer, set ENABLE_DEMO_MODE to true for local UI testing (never in production).",
      [{
        label: "Open Telegram",
        primary: true,
        onClick: () => {
          const url = CONFIG.BOT_USERNAME
            ? `https://t.me/${CONFIG.BOT_USERNAME.replace(/^@/, "")}`
            : "https://telegram.org/";
          window.open(url, "_blank", "noopener,noreferrer");
        }
      }]
    );
    return;
  }

  if (!CONFIG.API_BASE_URL || CONFIG.API_BASE_URL.includes("YOUR-BACKEND-DOMAIN")) {
    showBootError(
      "Configuration required",
      "Set CONFIG.API_BASE_URL in index.html to your AJ FM Stories Premium backend URL, then reload.",
      []
    );
    return;
  }

  // 3. Authenticate with the backend (server verifies initData signature)
  try {
    await refreshMe();
  } catch (err) {
    if (err.kind === "auth" || err.status === 401) {
      showBootError(
        "Session expired",
        "Your Telegram session could not be verified. Please close this app and reopen it from the bot.",
        [{ label: "Close", primary: true, onClick: () => TG.close() }]
      );
      return;
    }
    if (err.kind === "network" || err.kind === "timeout") {
      showBootError(
        "Cannot reach the server",
        err.message + " Check your connection and try again.",
        [{
          label: "Retry", primary: true,
          onClick: () => { $("#boot-actions").textContent = ""; $("#boot-spinner").style.display = ""; bootstrap(); }
        }]
      );
      return;
    }
    // Non-fatal: continue with a degraded session.
    console.warn("[bootstrap] /api/me failed:", err.message);
    State.user = TG.safeUser() || null;
    State.isAdmin = false;
    if (err.kind === "notfound") {
      showBootError(
        "Backend endpoint missing",
        "The backend did not expose /api/me. Verify the API contract described in the source comments.",
        []
      );
      return;
    }
    toast("Signed in with limited access. Some features may be unavailable.", "info", 5200);
  }

  // 4. Wire UI
  hideBoot();
  wireHeader();
  wireMiniPlayer();

  TG.onViewport(() => {
    // Keep the sheet sized correctly when the keyboard opens/closes.
    const sheet = document.querySelector(".sheet.show");
    if (sheet) sheet.style.maxHeight = "92dvh";
  });

  TG.showBackButton(false, handleGlobalBack);

  // 5. Prefetch facets (non-blocking)
  Api.get("/api/facets", null, { dedupeKey: "facets" })
    .then(data => {
      State.facets = {
        genres: (data && data.genres) || [],
        languages: (data && data.languages) || [],
        platforms: (data && data.platforms) || []
      };
    })
    .catch(() => {});

  // 6. First render
  navigate("home", {}, { replace: true });

  // 7. Handle deep-link entry (e.g. bot opened with a story id)
  try {
    const startParam = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe
      ? window.Telegram.WebApp.initDataUnsafe.start_param
      : null;
    if (startParam && typeof startParam === "string" && startParam.startsWith("story_")) {
      const id = startParam.slice("story_".length);
      if (id) navigate("story", { id });
    }
  } catch (_) {}

  State.ready = true;
}

/* Boot on DOM ready */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootstrap);
} else {
  bootstrap();
}

/* ------------------------------------------------------------
   21. GLOBAL ERROR SAFETY NET
   ------------------------------------------------------------ */
window.addEventListener("unhandledrejection", (event) => {
  const reason = event.reason;
  if (reason instanceof ApiError) {
    // Already surfaced at call sites.
    return;
  }
  console.error("[unhandled promise]", reason);
});

window.addEventListener("error", (event) => {
  console.error("[uncaught error]", event.error || event.message);
});

/* Prevent accidental form submits / pull-to-refresh inside the scroll area. */
document.addEventListener("submit", (e) => e.preventDefault());
</script>
