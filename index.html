   9. HOME VIEW
   ------------------------------------------------------------ */
async function renderHomeView(root) {
  const page = el("div", { class: "page" });
  root.appendChild(page);

  const featuredHost = el("div");
  page.appendChild(featuredHost);

  const sectionsHost = el("div");
  page.appendChild(sectionsHost);

  // Featured skeleton
  featuredHost.appendChild(el("div", { class: "sk sk-hero" }));

  loadFeatured(featuredHost);

  const sections = [
    { key: "continue", title: "Continue Listening", endpoint: "continue" },
    { key: "recent", title: "Recently Added", endpoint: "recent" },
    { key: "updated", title: "Recently Updated", endpoint: "updated" },
    { key: "completed", title: "Completed Stories", endpoint: "completed" },
    { key: "trending", title: "Trending", endpoint: "trending" },
    { key: "recommended", title: "Recommended For You", endpoint: "recommended" }
  ];

  for (const s of sections) {
    const sec = el("section", { class: "section" });
    const head = el("div", { class: "section-head" },
      el("div", { class: "section-title", text: s.title }),
      el("button", {
        class: "section-link", text: "See all",
        onClick: () => {
          State.discover.page = 1;
          State.discover.loaded = false;
          navigate("discover", { preset: s.key });
        }
      })
    );
    sec.appendChild(head);
    const host = el("div");
    sec.appendChild(host);
    host.appendChild(sectionSkeleton(4));
    sectionsHost.appendChild(sec);
    loadCatalogSection(s, host, sec);
  }

  // Genres
  const genreSec = el("section", { class: "section" });
  genreSec.appendChild(el("div", { class: "section-head" },
    el("div", { class: "section-title", text: "Popular Genres" })
  ));
  const genreHost = el("div");
  genreSec.appendChild(genreHost);
  sectionsHost.appendChild(genreSec);
  loadGenres(genreHost);
}

async function loadFeatured(host) {
  host.textContent = "";
  host.appendChild(el("div", { class: "sk sk-hero" }));
  try {
    const data = await Api.get("/api/catalog", { section: "featured", limit: 1 });
    const item = (data && Array.isArray(data.items) && data.items[0]) || null;
    host.textContent = "";
    if (!item) {
      host.appendChild(el("div", { class: "sk sk-hero", style: { opacity: ".35" } }));
      return;
    }
    host.appendChild(FeaturedHero(item));
  } catch (err) {
    host.textContent = "";
    const wrap = el("div", { class: "hero" });
    const inner = el("div", { class: "hero-inner" });
    inner.appendChild(el("div", { class: "hero-body" },
      el("div", { class: "hero-eyebrow", text: "Featured" }),
      el("div", { class: "hero-title", text: "Featured story unavailable" }),
      el("div", { class: "hero-desc", text: err.message || "Could not load the featured story." }),
      el("div", { class: "hero-actions" },
        el("button", {
          class: "btn btn-ghost btn-sm", text: "Retry",
          onClick: () => loadFeatured(host)
        })
      )
    ));
    wrap.appendChild(inner);
    host.appendChild(wrap);
  }
}

function FeaturedHero(story) {
  const hero = el("div", { class: "hero" });

  const bgSrc = story.cover_url || story.cover || story.image_url;
  if (bgSrc) {
    const bg = el("img", { class: "hero-bg", alt: "", attrs: { "aria-hidden": "true", loading: "lazy", referrerpolicy: "no-referrer" } });
    bg.addEventListener("error", () => bg.remove());
    bg.src = bgSrc;
    hero.appendChild(bg);
  }
  hero.appendChild(el("div", { class: "hero-veil" }));

  const inner = el("div", { class: "hero-inner" });

  const cw = el("div", { class: "hero-cover" });
  cw.appendChild(coverImage(bgSrc, story.title, ""));
  const cimg = cw.querySelector("img");
  if (cimg) { cimg.style.width = "100%"; cimg.style.height = "100%"; cimg.style.objectFit = "cover"; }
  inner.appendChild(cw);

  const body = el("div", { class: "hero-body" });
  body.appendChild(el("div", { class: "hero-eyebrow", text: "Featured" }));
  body.appendChild(el("div", { class: "hero-title", text: story.title || "Untitled" }));

  const chips = el("div", { class: "chip-row" });
  if (story.genre) chips.appendChild(el("span", { class: "chip", text: story.genre }));
  if (story.language) chips.appendChild(el("span", { class: "chip plain", text: story.language }));
  const st = statusBadge(story.status);
  if (st) chips.appendChild(st);
  if (chips.childNodes.length) body.appendChild(chips);

  if (story.description) {
    body.appendChild(el("div", { class: "hero-desc", text: story.description }));
  }

  const actions = el("div", { class: "hero-actions" });
  const hasProgress = story.progress_percent != null && Number(story.progress_percent) > 0;

  if (hasProgress && story.last_episode_id) {
    actions.appendChild(el("button", {
      class: "btn btn-primary btn-sm",
      onClick: () => playEpisode({
        episodeId: story.last_episode_id,
        episodeNumber: story.last_episode_number,
        episodeTitle: story.last_episode_title || "Continue",
        storyId: story.id,
        storyTitle: story.title,
        cover: bgSrc
      })
    }, svg('<path d="M8 5.2v13.6L19 12z"/>', 16, { fill: "currentColor", stroke: "none" }), "Continue Listening"));
  }

  actions.appendChild(el("button", {
    class: hasProgress ? "btn btn-ghost btn-sm" : "btn btn-primary btn-sm",
    text: "View Story",
    onClick: () => navigate("story", { id: story.id })
  }));

  body.appendChild(actions);
  inner.appendChild(body);
  hero.appendChild(inner);
  return hero;
}

async function loadCatalogSection(section, host, sectionEl) {
  try {
    const data = await Api.get("/api/catalog", {
      section: section.endpoint,
      limit: 12
    });
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    host.textContent = "";
    if (!items.length) {
      if (section.key === "continue" || section.key === "recommended" || section.key === "trending") {
        sectionEl.remove();
      } else {
        host.appendChild(el("div", { class: "muted tiny", text: "Nothing here yet." }));
      }
      return;
    }
    const rail = el("div", { class: "rail" });
    for (const item of items) rail.appendChild(StoryCard(item));
    host.appendChild(rail);
  } catch (err) {
    host.textContent = "";
    if (section.key === "trending" || section.key === "recommended" || section.key === "continue") {
      sectionEl.remove();
      return;
    }
    host.appendChild(el("div", { class: "row" },
      el("div", { class: "muted tiny grow", text: err.message || "Failed to load." }),
      el("button", {
        class: "btn btn-soft btn-sm", text: "Retry",
        onClick: () => { host.textContent = ""; host.appendChild(sectionSkeleton(4)); loadCatalogSection(section, host, sectionEl); }
      })
    ));
  }
}

async function loadGenres(host) {
  try {
    let genres = State.facets.genres;
    if (!genres || !genres.length) {
      const data = await Api.get("/api/facets", null, { dedupeKey: "facets" });
      State.facets = {
        genres: (data && data.genres) || [],
        languages: (data && data.languages) || [],
        platforms: (data && data.platforms) || []
      };
      genres = State.facets.genres;
    }
    host.textContent = "";
    if (!genres || !genres.length) {
      host.appendChild(el("div", { class: "muted tiny", text: "No genres configured yet." }));
      return;
    }
    const scroll = el("div", { class: "filter-scroll" });
    for (const g of genres) {
      const name = typeof g === "string" ? g : (g.name || g.label || "");
      if (!name) continue;
      scroll.appendChild(el("button", {
        class: "filter-chip",
        text: name,
        onClick: () => {
          State.discover.genre = name;
          State.discover.page = 1;
          State.discover.loaded = false;
          navigate("discover", { genre: name });
        }
      }));
    }
    host.appendChild(scroll);
  } catch (_) {
    host.textContent = "";
    host.appendChild(el("div", { class: "muted tiny", text: "Genres unavailable." }));
  }
}

/* ------------------------------------------------------------
   10. DISCOVER VIEW
   ------------------------------------------------------------ */
async function renderDiscoverView(root, params) {
  const page = el("div", { class: "page" });
  root.appendChild(page);

  if (params && params.genre && !State.discover.loaded) {
    State.discover.genre = params.genre;
  }

  // Search
  const searchBar = el("div", { class: "search-bar" });
  searchBar.appendChild(svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>', 19));
  const input = el("input", {
    type: "search",
    placeholder: "Search by title or author…",
    value: State.discover.q,
    attrs: { "aria-label": "Search stories", enterkeyhint: "search", autocomplete: "off" }
  });
  searchBar.appendChild(input);
  const clearBtn = el("button", {
    class: "icon-btn",
    attrs: { "aria-label": "Clear search", style: "width:32px;height:32px;" },
    onClick: () => { input.value = ""; State.discover.q = ""; State.discover.page = 1; State.discover.loaded = false; runSearch(); }
  }, svg('<path d="M18 6L6 18M6 6l12 12"/>', 17));
  searchBar.appendChild(clearBtn);
  page.appendChild(searchBar);

  // Filters
  const filtersHost = el("div", { class: "mt-8" });
  page.appendChild(filtersHost);

  const resultsHost = el("div", { class: "mt-16" });
  page.appendChild(resultsHost);

  const debounced = debounce(() => {
    State.discover.q = input.value.trim();
    State.discover.page = 1;
    State.discover.loaded = false;
    runSearch();
  }, CONFIG.SEARCH_DEBOUNCE_MS);

  input.addEventListener("input", debounced);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      State.discover.q = input.value.trim();
      State.discover.page = 1;
      State.discover.loaded = false;
      runSearch();
      input.blur();
    }
  });

  renderFilters(filtersHost);
  runSearch();
}

function renderFilters(host) {
  host.textContent = "";

  const makeChip = (label, isActive, onClick) =>
    el("button", { class: "filter-chip" + (isActive ? " active" : ""), text: label, onClick });

  // Sort row
  const sortScroll = el("div", { class: "filter-scroll" });
  const sorts = [
    { id: "newest", label: "Newest" },
    { id: "oldest", label: "Oldest" },
    { id: "title", label: "Title A–Z" },
    { id: "popular", label: "Popular" }
  ];
  for (const s of sorts) {
    sortScroll.appendChild(makeChip(s.label, State.discover.sort === s.id, () => {
      State.discover.sort = s.id;
      State.discover.page = 1;
      State.discover.loaded = false;
      renderFilters(host);
      runSearch();
    }));
  }
  host.appendChild(sortScroll);

  // Status row
  const statusScroll = el("div", { class: "filter-scroll" });
  const statuses = [
    { id: "", label: "All status" },
    { id: "ongoing", label: "Ongoing" },
    { id: "completed", label: "Completed" }
  ];
  for (const s of statuses) {
    statusScroll.appendChild(makeChip(s.label, State.discover.status === s.id, () => {
      State.discover.status = s.id;
      State.discover.page = 1;
      State.discover.loaded = false;
      renderFilters(host);
      runSearch();
    }));
  }
  host.appendChild(statusScroll);

  // Genre row
  if (State.facets.genres && State.facets.genres.length) {
    const genreScroll = el("div", { class: "filter-scroll" });
    genreScroll.appendChild(makeChip("All genres", !State.discover.genre, () => {
      State.discover.genre = "";
      State.discover.page = 1;
      State.discover.loaded = false;
      renderFilters(host);
      runSearch();
    }));
    for (const g of State.facets.genres) {
      const name = typeof g === "string" ? g : (g.name || g.label || "");
      if (!name) continue;
      genreScroll.appendChild(makeChip(name, State.discover.genre === name, () => {
        State.discover.genre = name;
        State.discover.page = 1;
        State.discover.loaded = false;
        renderFilters(host);
        runSearch();
      }));
    }
    host.appendChild(genreScroll);
  }

  // Language row
  if (State.facets.languages && State.facets.languages.length) {
    const langScroll = el("div", { class: "filter-scroll" });
    langScroll.appendChild(makeChip("All languages", !State.discover.language, () => {
      State.discover.language = "";
      State.discover.page = 1;
      State.discover.loaded = false;
      renderFilters(host);
      runSearch();
    }));
    for (const l of State.facets.languages) {
      const name = typeof l === "string" ? l : (l.name || l.label || "");
      if (!name) continue;
      langScroll.appendChild(makeChip(name, State.discover.language === name, () => {
        State.discover.language = name;
        State.discover.page = 1;
        State.discover.loaded = false;
        renderFilters(host);
        runSearch();
      }));
    }
    host.appendChild(langScroll);
  }

  // Platform row
  if (State.facets.platforms && State.facets.platforms.length) {
    const platScroll = el("div", { class: "filter-scroll" });
    platScroll.appendChild(makeChip("All platforms", !State.discover.platform, () => {
      State.discover.platform = "";
      State.discover.page = 1;
      State.discover.loaded = false;
      renderFilters(host);
      runSearch();
    }));
    for (const p of State.facets.platforms) {
      const name = typeof p === "string" ? p : (p.name || p.label || "");
      if (!name) continue;
      platScroll.appendChild(makeChip(name, State.discover.platform === name, () => {
        State.discover.platform = name;
        State.discover.page = 1;
        State.discover.loaded = false;
        renderFilters(host);
        runSearch();
      }));
    }
    host.appendChild(platScroll);
  }

  // Clear all
  const hasAny = State.discover.q || State.discover.genre || State.discover.language ||
                 State.discover.platform || State.discover.status || State.discover.sort !== "newest";
  if (hasAny) {
    host.appendChild(el("div", { class: "row", style: { paddingTop: "4px" } },
      el("button", {
        class: "btn btn-soft btn-sm",
        text: "Clear all filters",
        onClick: () => {
          State.discover.q = "";
          State.discover.genre = "";
          State.discover.language = "";
          State.discover.platform = "";
          State.discover.status = "";
          State.discover.sort = "newest";
          State.discover.page = 1;
          State.discover.loaded = false;
          navigate("discover", {}, { replace: true });
        }
      })
    ));
  }
}

async function runSearch() {
  const host = $("#view-root .page > div:last-child");
  const resultsHost = host;
  if (!resultsHost) return;

  const d = State.discover;
  resultsHost.textContent = "";

  // Loading state
  const loadingWrap = el("div");
  for (let i = 0; i < 5; i++) loadingWrap.appendChild(el("div", { class: "sk sk-row" }));
  resultsHost.appendChild(loadingWrap);

  try {
    const data = await Api.get("/api/catalog", {
      q: d.q,
      genre: d.genre,
      language: d.language,
      platform: d.platform,
      status: d.status,
      sort: d.sort,
      page: d.page,
      page_size: d.pageSize
    });

    const items = (data && Array.isArray(data.items)) ? data.items : [];
    d.items = items;
    d.total = Number(data && data.total) || items.length;
    d.totalPages = Number(data && data.total_pages) ||
      Math.max(1, Math.ceil(d.total / d.pageSize));
    d.loaded = true;
    d.error = null;

    resultsHost.textContent = "";

    if (!items.length) {
      resultsHost.appendChild(emptyBox(
        "No stories found",
        d.q || d.genre || d.status || d.platform || d.language
          ? "Try adjusting your search or clearing filters."
          : "The catalog is empty right now. Check back soon.",
        "Clear filters",
        () => {
          State.discover.q = "";
          State.discover.genre = "";
          State.discover.language = "";
          State.discover.platform = "";
          State.discover.status = "";
          State.discover.page = 1;
          navigate("discover", {}, { replace: true });
        }
      ));
      return;
    }

    resultsHost.appendChild(el("div", { class: "tiny muted mb-8", text:
      `${d.total} ${d.total === 1 ? "story" : "stories"}` }));

    const list = el("div", { style: { display: "flex", flexDirection: "column", gap: "9px" } });
    for (const item of items) list.appendChild(StoryRow(item));
    resultsHost.appendChild(list);

    resultsHost.appendChild(buildPager(d.page, d.totalPages, (p) => {
      d.page = p;
      runSearch();
      const vr = $("#view-root");
      if (vr) vr.scrollTo({ top: 0, behavior: "smooth" });
    }));

  } catch (err) {
    d.error = err;
    resultsHost.textContent = "";
    resultsHost.appendChild(errorBox(err.message, () => runSearch()));
  }
}

function buildPager(current, totalPages, onChange) {
  const pager = el("div", { class: "pager" });
  const safeTotal = Math.max(1, totalPages || 1);
  const cur = clampNumber(current, 1, safeTotal, 1);

  pager.appendChild(el("button", {
    class: "btn btn-soft btn-sm",
    text: "‹ Prev",
    disabled: cur <= 1,
    onClick: () => onChange(cur - 1)
  }));

  const info = el("span", { class: "page-info" });
  info.appendChild(el("strong", { text: `Page ${cur}` }));
  info.appendChild(document.createTextNode(` of ${safeTotal}`));
  pager.appendChild(info);

  pager.appendChild(el("button", {
    class: "btn btn-soft btn-sm",
    text: "Next ›",
    disabled: cur >= safeTotal,
    onClick: () => onChange(cur + 1)
  }));

  // Jump to page
  const jumpWrap = el("div", { class: "row", style: { width: "100%", justifyContent: "center", marginTop: "6px" } });
  const jumpInput = el("input", {
    class: "input",
    type: "number",
    min: "1",
    max: String(safeTotal),
    placeholder: "Go to page",
    style: { maxWidth: "130px", minHeight: "38px", textAlign: "center" },
    attrs: { "aria-label": "Jump to page" }
  });
  jumpWrap.appendChild(jumpInput);
  jumpWrap.appendChild(el("button", {
    class: "btn btn-ghost btn-sm",
    text: "Go",
    onClick: () => {
      const v = clampNumber(jumpInput.value, 1, safeTotal, cur);
      if (v !== cur) onChange(v);
    }
  }));
  pager.appendChild(jumpWrap);

  return pager;
}

/* ------------------------------------------------------------
   11. STORY DETAILS VIEW
   ------------------------------------------------------------ */
async function renderStoryView(root, params) {
  const page = el("div", { class: "page" });
  root.appendChild(page);

  const storyId = params && params.id;
  if (!storyId) {
    page.appendChild(errorBox("No story was specified.", () => navigate("home")));
    return;
  }

  State.story.id = storyId;
  State.story.loading = true;
  State.story.error = null;

  const loading = el("div");
  loading.appendChild(el("div", { class: "sk", style: { height: "220px", borderRadius: "18px", marginBottom: "18px" } }));
  for (let i = 0; i < 4; i++) loading.appendChild(el("div", { class: "sk sk-line", style: { height: "13px", marginBottom: "10px" } }));
  page.appendChild(loading);

  let data;
  try {
    data = await Api.get(`/api/story/${encodeURIComponent(storyId)}`, null, { dedupeKey: `story:${storyId}` });
  } catch (err) {
    page.textContent = "";
    page.appendChild(errorBox(err.message, () => renderStoryView(root, params)));
    return;
  }

  const story = (data && data.story) || data || null;
  if (!story || !story.id && !story.title) {
    page.textContent = "";
    page.appendChild(errorBox("This story could not be found.", () => navigate("home")));
    return;
  }

  State.story.data = story;
  State.story.access = (data && data.access) || null;
  State.story.plans = (data && Array.isArray(data.plans)) ? data.plans : [];

  page.textContent = "";

  // Hero
  const hero = el("div", { class: "hero", style: { marginBottom: "18px" } });
  const coverSrc = story.cover_url || story.cover || story.image_url;
  if (coverSrc) {
    const bg = el("img", { class: "hero-bg", alt: "", attrs: { "aria-hidden": "true", referrerpolicy: "no-referrer" } });
    bg.addEventListener("error", () => bg.remove());
    bg.src = coverSrc;
    hero.appendChild(bg);
  }
  hero.appendChild(el("div", { class: "hero-veil" }));

  const inner = el("div", { class: "hero-inner" });
  const cw = el("div", { class: "hero-cover" });
  cw.appendChild(coverImage(coverSrc, story.title, ""));
  const ci = cw.querySelector("img");
  if (ci) { ci.style.width = "100%"; ci.style.height = "100%"; ci.style.objectFit = "cover"; }
  inner.appendChild(cw);

  const hb = el("div", { class: "hero-body" });
  hb.appendChild(el("div", { class: "hero-title", text: story.title || "Untitled" }));
  if (story.author) hb.appendChild(el("div", { class: "tiny muted", text: `by ${story.author}` }));

  const chipRow = el("div", { class: "chip-row" });
  const pushChip = (v, cls) => { if (v) chipRow.appendChild(el("span", { class: `chip ${cls || ""}`, text: String(v) })); };
  pushChip(story.genre);
  pushChip(story.language, "plain");
  pushChip(story.platform, "plain");
  pushChip(story.voice_type, "plain");
  const stBadge = statusBadge(story.status);
  if (stBadge) chipRow.appendChild(stBadge);
  const range = episodeRangeLabel(story);
  if (range) pushChip(range, "plain");
  if (chipRow.childNodes.length) hb.appendChild(chipRow);

  inner.appendChild(hb);
  hero.appendChild(inner);
  page.appendChild(hero);

  // Access / progress
  const access = State.story.access || {};
  const progressPercent = Number(access.progress_percent != null ? access.progress_percent : story.progress_percent);

  if (isFinite(progressPercent) && progressPercent > 0) {
    const pWrap = el("div", { style: { marginBottom: "16px" } });
    pWrap.appendChild(el("div", { class: "row", style: { justifyContent: "space-between", marginBottom: "6px" } },
      el("span", { class: "tiny muted", text: "Your progress" }),
      el("span", { class: "tiny", style: { color: "var(--gold)" }, text: `${Math.round(progressPercent)}%` })
    ));
    pWrap.appendChild(el("div", { class: "ep-progress", style: { height: "5px" } },
      el("i", { style: { width: Math.min(100, progressPercent) + "%" } })
    ));
    page.appendChild(pWrap);
  }

  // Description
  if (story.description) {
    const descWrap = el("div", { class: "section" });
    descWrap.appendChild(el("div", { class: "section-title mb-8", text: "About this story" }));
    const desc = el("div", { class: "clamp-6", style: { fontSize: "13.5px", lineHeight: "1.6", color: "var(--text-2)", whiteSpace: "pre-wrap", wordBreak: "break-word" }, text: story.description });
    descWrap.appendChild(desc);
    let expanded = false;
    const toggle = el("button", {
      class: "btn btn-soft btn-sm mt-8",
      text: "Read more",
      onClick: () => {
        expanded = !expanded;
        desc.className = expanded ? "" : "clamp-6";
        toggle.textContent = expanded ? "Show less" : "Read more";
      }
    });
    if (story.description.length > 260) descWrap.appendChild(toggle);
    page.appendChild(descWrap);
  }

  // Metadata grid
  const metaSection = el("div", { class: "section" });
  metaSection.appendChild(el("div", { class: "section-title mb-8", text: "Details" }));
  const dl = el("dl", { class: "order-grid", style: { gridTemplateColumns: "1fr 1fr", gap: "9px 14px" } });
  const addMeta = (k, v) => {
    if (v === null || v === undefined || v === "") return;
    dl.appendChild(el("dt", { text: k }));
    dl.appendChild(el("dd", { text: String(v) }));
  };
  addMeta("Platform", story.platform);
  addMeta("Language", story.language);
  addMeta("Genre", story.genre);
  addMeta("Voice", story.voice_type);
  addMeta("Status", story.status);
  addMeta("Episodes", story.episode_count);
  addMeta("Range", (story.start_episode != null && story.end_episode != null)
    ? `${story.start_episode} – ${story.end_episode}` : null);
  addMeta("Updated", story.updated_at ? formatDate(story.updated_at) : null);
  if (dl.childNodes.length) metaSection.appendChild(dl);
  page.appendChild(metaSection);

  // Availability note for unpublished but owned
  if (story.published === false || story.is_published === false) {
    const note = el("div", {
      style: {
        padding: "12px 14px", borderRadius: "12px", marginBottom: "16px",
        background: "rgba(240,165,0,.1)", border: "1px solid rgba(240,165,0,.3)",
        fontSize: "12.5px", color: "#f5bc4a", lineHeight: "1.5"
      },
      text: "This story is currently unpublished. Your purchase history is preserved, but new playback may be unavailable until it is republished."
    });
    page.appendChild(note);
  }

  // Actions
  const actions = el("div", { style: { display: "flex", flexDirection: "column", gap: "10px", marginBottom: "22px" } });

  const canPlay = access.can_play === true || access.has_access === true ||
                  access.state === "owned" || access.state === "rented" || access.state === "partial";

  if (access.last_episode_id || (isFinite(progressPercent) && progressPercent > 0 && access.last_episode_id)) {
    actions.appendChild(el("button", {
      class: "btn btn-primary btn-block",
      onClick: () => playEpisode({
        episodeId: access.last_episode_id,
        episodeNumber: access.last_episode_number,
        episodeTitle: access.last_episode_title || "Continue",
        storyId: story.id,
        storyTitle: story.title,
        cover: coverSrc
      })
    }, svg('<path d="M8 5.2v13.6L19 12z"/>', 17, { fill: "currentColor", stroke: "none" }), "Continue Listening"));
  }

  actions.appendChild(el("button", {
    class: canPlay ? "btn btn-ghost btn-block" : "btn btn-primary btn-block",
    text: "View Episodes",
    onClick: () => navigate("episodes", { id: story.id })
  }));

  if (!canPlay) {
    if (State.story.plans.length) {
      actions.appendChild(el("button", {
        class: "btn btn-primary btn-block",
        text: "Unlock / Buy",
        onClick: () => openPurchaseSheet(story)
      }));
    } else {
      actions.appendChild(el("div", {
        class: "tiny muted",
        style: { textAlign: "center", padding: "10px" },
        text: "Purchase options are not available for this story yet."
      }));
    }
  } else if (State.story.plans.length) {
    actions.appendChild(el("button", {
      class: "btn btn-soft btn-block",
      text: "View purchase options",
      onClick: () => openPurchaseSheet(story)
    }));
  }

  page.appendChild(actions);
}

/* ------------------------------------------------------------
   12. PURCHASE FLOW
   ------------------------------------------------------------ */
function openPurchaseSheet(story) {
  const plans = State.story.plans || [];
  if (!plans.length) {
    toast("No purchase options are available for this story.", "info");
    return;
  }

  let selectedId = null;
  const listWrap = el("div");
  const confirmBtn = el("button", {
    class: "btn btn-primary btn-block",
    text: "Continue",
    disabled: true
  });

  const content = el("div");
  content.appendChild(el("div", { class: "tiny muted mb-8", text: story.title || "" }));
  content.appendChild(el("div", { class: "tiny muted mb-16", text: "Choose a plan. Final pricing is confirmed by the bot before payment." }));
  content.appendChild(listWrap);

  function renderPlans() {
    listWrap.textContent = "";
    for (const plan of plans) {
      const id = plan.id != null ? plan.id : plan.plan_id;
      const card = el("button", {
        class: "plan-card" + (selectedId === id ? " selected" : ""),
        attrs: { "aria-pressed": selectedId === id ? "true" : "false" },
        onClick: () => { selectedId = id; renderPlans(); confirmBtn.disabled = false; }
      });

      const top = el("div", { class: "plan-top" });
      top.appendChild(el("div", { class: "plan-name", text: plan.name || plan.label || planTypeLabel(plan.type) }));
      top.appendChild(el("div", { class: "plan-price", text: plan.price_display || formatPrice(plan) }));
      card.appendChild(top);

      if (plan.description) {
        card.appendChild(el("div", { class: "plan-desc", text: plan.description }));
      }

      const tags = el("div", { class: "plan-tags" });
      if (plan.type) tags.appendChild(el("span", { class: "chip", text: planTypeLabel(plan.type) }));
      if (plan.episode_start != null && plan.episode_end != null) {
        tags.appendChild(el("span", { class: "chip plain", text: `Episodes ${plan.episode_start}–${plan.episode_end}` }));
      }
      if (plan.rental_days != null && Number(plan.rental_days) > 0) {
        tags.appendChild(el("span", { class: "chip plain", text: `${plan.rental_days} days rental` }));
      }
      if (plan.discount_percent != null && Number(plan.discount_percent) > 0) {
        tags.appendChild(el("span", { class: "chip", text: `${plan.discount_percent}% off` }));
      }
      if (tags.childNodes.length) card.appendChild(tags);

      listWrap.appendChild(card);
    }
  }

  renderPlans();

  const overlay = Overlay.open({
    title: "Purchase Options",
    kind: "sheet",
    content,
    footer: el("div", { class: "row", style: { width: "100%" } },
      el("button", { class: "btn btn-soft", text: "Cancel", onClick: () => Overlay.close() }),
      confirmBtn
    )
  });

  confirmBtn.addEventListener("click", async () => {
    if (selectedId == null) return;
    const plan = plans.find(p => (p.id != null ? p.id : p.plan_id) === selectedId);
    if (!plan) return;

    Overlay.close();
    openOrderConfirmation(story, plan);
  });
}

function planTypeLabel(type) {
  const map = {
    rent: "Rental",
    full: "Full Story",
    full_story: "Full Story",
    range: "Episode Range",
    episode_range: "Episode Range",
    pack: "Episode Pack",
    episode_pack: "Episode Pack"
  };
  const t = String(type || "").toLowerCase();
  return map[t] || (t ? t.replace(/_/g, " ") : "Plan");
}

function formatPrice(plan) {
  const amount = plan.price != null ? plan.price : plan.amount;
  if (amount == null) return "--";
  const currency = plan.currency || plan.currency_symbol || "";
  const num = Number(amount);
  if (!isFinite(num)) return `${currency} ${amount}`.trim();
  return `${currency} ${num.toFixed(2)}`.trim();
}

function openOrderConfirmation(story, plan) {
  const content = el("div");

  const summary = el("div", {
    style: {
      padding: "14px", borderRadius: "12px", marginBottom: "14px",
      background: "rgba(212,175,55,.07)", border: "1px solid var(--gold-border)"
    }
  });

  const rows = [
    ["Story", story.title || "--"],
    ["Plan", plan.name || plan.label || planTypeLabel(plan.type)],
    ["Price", plan.price_display || formatPrice(plan)]
  ];
  if (plan.episode_start != null && plan.episode_end != null) {
    rows.push(["Episodes", `${plan.episode_start} – ${plan.episode_end}`]);
  }
  if (plan.rental_days != null && Number(plan.rental_days) > 0) {
    rows.push(["Rental period", `${plan.rental_days} days`]);
  }

  const dl = el("dl", { class: "order-grid", style: { gridTemplateColumns: "auto 1fr" } });
  for (const [k, v] of rows) {
    dl.appendChild(el("dt", { text: k }));
    dl.appendChild(el("dd", { text: String(v) }));
  }
  summary.appendChild(dl);
  content.appendChild(summary);

  content.appendChild(el("div", {
    class: "tiny muted",
    style: { lineHeight: "1.55" },
    text: "You will be redirected to the Telegram bot to confirm this order. The final amount and any coupon discount are confirmed by the bot before payment. No payment details are entered in this app."
  }));

  const confirmBtn = el("button", { class: "btn btn-primary", text: "Confirm & Open Bot" });
  const cancelBtn = el("button", { class: "btn btn-soft", text: "Cancel", onClick: () => Overlay.close() });

  Overlay.open({
    title: "Confirm Order",
    content,
    footer: el("div", { class: "row", style: { width: "100%" } }, cancelBtn, confirmBtn)
  });

  confirmBtn.addEventListener("click", async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Creating order…";
    try {
      const res = await Api.post("/api/orders", {
        story_id: story.id,
        plan_id: plan.id != null ? plan.id : plan.plan_id
      }, { dedupeKey: `order:${story.id}:${plan.id != null ? plan.id : plan.plan_id}` });

      const order = (res && res.order) || res;
      const deepLink = order && (order.deep_link || order.deepLink || order.bot_link);

      if (!deepLink) {
        throw new ApiError("The server did not return a checkout link. Please try again later.", { kind: "server" });
      }

      let url = deepLink;
      if (url.startsWith("/") && CONFIG.BOT_USERNAME) {
        url = `https://t.me/${CONFIG.BOT_USERNAME.replace(/^@/, "")}?start=${encodeURIComponent(url.replace(/^\/(start)?=?/, ""))}`;
      }

      const opened = TG.openLink(url);
      Overlay.close();

      if (opened) {
        toast("Order created. Complete payment in the bot.", "success", 5200);
        State.counts.pending_orders = (Number(State.counts.pending_orders) || 0) + 1;
        updateHeaderIndicators();
      } else {
        toast("Could not open Telegram. Order reference: " + (order.id || order.order_id || "--"), "info", 6000);
      }
    } catch (err) {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Confirm & Open Bot";
      toast(err.message || "Could not create the order.", "error", 5200);
    }
  });
}

/* ------------------------------------------------------------
   13. EPISODES VIEW
   ------------------------------------------------------------ */
async function renderEpisodesView(root, params) {
  const page = el("div", { class: "page" });
  root.appendChild(page);

  const storyId = params && params.id;
  if (!storyId) {
    page.appendChild(errorBox("No story was specified.", () => navigate("home")));
    return;
  }

  if (State.episodes.storyId !== storyId) {
    State.episodes.storyId = storyId;
    State.episodes.page = 1;
    State.episodes.q = "";
    State.episodes.status = "";
    State.episodes.items = [];
  }

  page.appendChild(el("h2", {
    style: { fontSize: "18px", fontWeight: "750", margin: "0 0 4px" },
    text: "Episodes"
  }));
  const storyTitleEl = el("div", { class: "tiny muted mb-16", text: "" });
  page.appendChild(storyTitleEl);

  // Toolbar
  const toolbar = el("div", { class: "ep-toolbar" });

  const searchBar = el("div", { class: "search-bar" });
  searchBar.appendChild(svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>', 18));
  const searchInput = el("input", {
    type: "search",
    placeholder: "Search episode number or title…",
    value: State.episodes.q,
    attrs: { "aria-label": "Search episodes", autocomplete: "off" }
  });
  searchBar.appendChild(searchInput);
  toolbar.appendChild(searchBar);

  const statusScroll = el("div", { class: "filter-scroll" });
  const statuses = [
    { id: "", label: "All" },
    { id: "unlocked", label: "Unlocked" },
    { id: "locked", label: "Locked" }
  ];
  for (const s of statuses) {
    statusScroll.appendChild(el("button", {
      class: "filter-chip" + (State.episodes.status === s.id ? " active" : ""),
      text: s.label,
      onClick: () => {
        State.episodes.status = s.id;
        State.episodes.page = 1;
        State.episodes.items = [];
        renderEpisodesView(root, params);
      }
    }));
  }
  toolbar.appendChild(statusScroll);
  page.appendChild(toolbar);

  const listHost = el("div");
  page.appendChild(listHost);

  const debounced = debounce(() => {
    State.episodes.q = searchInput.value.trim();
    State.episodes.page = 1;
    loadEpisodes(storyId, listHost, storyTitleEl);
  }, CONFIG.SEARCH_DEBOUNCE_MS);
  searchInput.addEventListener("input", debounced);

  // Load story title (cached if we already have it)
  if (State.story.data && State.story.data.id === storyId) {
    storyTitleEl.textContent = State.story.data.title || "";
  } else {
    Api.get(`/api/story/${encodeURIComponent(storyId)}`, null, { dedupeKey: `story:${storyId}` })
      .then(d => {
        const s = (d && d.story) || d;
        if (s && s.title) {
          storyTitleEl.textContent = s.title;
          if (!State.story.data || State.story.data.id !== storyId) {
            State.story.data = s;
            State.story.access = (d && d.access) || null;
            State.story.plans = (d && Array.isArray(d.plans)) ? d.plans : [];
          }
        }
      })
      .catch(() => {});
  }

  loadEpisodes(storyId, listHost, storyTitleEl);
}

async function loadEpisodes(storyId, host, storyTitleEl) {
  const ep = State.episodes;
  host.textContent = "";

  const loading = el("div");
  for (let i = 0; i < 6; i++) loading.appendChild(el("div", { class: "sk sk-row", style: { height: "66px" } }));
  host.appendChild(loading);

  try {
    const data = await Api.get(`/api/story/${encodeURIComponent(storyId)}/episodes`, {
      page: ep.page,
      page_size: ep.pageSize,
      q: ep.q,
      status: ep.status
    });

    const items = (data && Array.isArray(data.items)) ? data.items : [];
    ep.items = items;
    ep.total = Number(data && data.total) || items.length;
    ep.totalPages = Number(data && data.total_pages) ||
      Math.max(1, Math.ceil(ep.total / ep.pageSize));
    ep.error = null;

    host.textContent = "";

    if (!items.length) {
      host.appendChild(emptyBox(
        "No episodes found",
        ep.q ? "No episodes match your search." : "This story has no published episodes yet.",
        ep.q ? "Clear search" : null,
        ep.q ? () => { ep.q = ""; ep.page = 1; renderCurrentView(); } : null
      ));
      return;
    }

    host.appendChild(el("div", { class: "tiny muted mb-8", text:
      `${ep.total} ${ep.total === 1 ? "episode" : "episodes"}` }));

    // Build queue for sequential playback from this page.
    const queue = items.map(it => ({
      episodeId: it.id != null ? it.id : it.episode_id,
      episodeNumber: it.episode_number,
      episodeTitle: episodeDisplayTitle(it),
      storyId,
      storyTitle: (State.story.data && State.story.data.title) || "",
      cover: (State.story.data && (State.story.data.cover_url || State.story.data.cover)) || "",
      locked: it.locked === true || it.has_access === false,
      duration: it.duration
    }));

    items.forEach((it, idx) => {
      host.appendChild(EpisodeRow(it, queue, idx));
    });

    host.appendChild(buildPager(ep.page, ep.totalPages, (p) => {
      ep.page = p;
      loadEpisodes(storyId, host, storyTitleEl);
      const vr = $("#view-root");
      if (vr) vr.scrollTo({ top: 0, behavior: "smooth" });
    }));

    // Episode-number jump
    const jumpWrap = el("div", { class: "row", style: { justifyContent: "center", gap: "8px", marginTop: "6px" } });
    const numInput = el("input", {
      class: "input", type: "number", placeholder: "Episode #",
      style: { maxWidth: "140px", minHeight: "40px", textAlign: "center" },
      attrs: { "aria-label": "Jump to episode number" }
    });
    jumpWrap.appendChild(numInput);
    jumpWrap.appendChild(el("button", {
      class: "btn btn-ghost btn-sm", text: "Jump",
      onClick: () => {
        const n = Number(numInput.value);
        if (!isFinite(n)) return;
        const target = items.find(it => Number(it.episode_number) === n);
        if (target) {
          const node = host.querySelector(`[data-ep-num="${n}"]`);
          if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          toast("That episode is not on this page. Use the page controls to find it.", "info");
        }
      }
    }));
    host.appendChild(jumpWrap);

  } catch (err) {
    ep.error = err;
    host.textContent = "";
    host.appendChild(errorBox(err.message, () => loadEpisodes(storyId, host, storyTitleEl)));
  }
}

function EpisodeRow(episode, queue, queueIndex) {
  const epId = episode.id != null ? episode.id : episode.episode_id;
  const num = episode.episode_number;
  const title = episodeDisplayTitle(episode);
  const locked = episode.locked === true || episode.has_access === false;
  const canPlay = !locked && (episode.playable !== false);

  const row = el("div", {
    class: "ep-row" + (locked ? " locked" : ""),
    dataset: { epNum: num != null ? String(num) : "", epId: String(epId) }
  });

  row.appendChild(el("div", { class: "ep-num", text: num != null ? String(num) : "–" }));

  const body = el("div", { class: "ep-body" });
  body.appendChild(el("div", { class: "ep-title", text: title }));

  const meta = el("div", { class: "ep-meta" });
  if (episode.duration) meta.appendChild(el("span", { text: formatDuration(episode.duration) }));
  if (locked) {
    meta.appendChild(el("span", { style: { color: "var(--muted)" }, text: "Locked" }));
  } else if (episode.progress_percent != null && Number(episode.progress_percent) > 0) {
    meta.appendChild(el("span", { style: { color: "var(--gold)" }, text: `${Math.round(Number(episode.progress_percent))}% played` }));
  }
  if (episode.published === false) meta.appendChild(el("span", { text: "Unpublished" }));
  body.appendChild(meta);

  if (episode.progress_percent != null && Number(episode.progress_percent) > 0) {
    body.appendChild(el("div", { class: "ep-progress" },
      el("i", { style: { width: Math.min(100, Number(episode.progress_percent)) + "%" } })
    ));
  }

  row.appendChild(body);

  if (canPlay) {
    row.appendChild(el("button", {
      class: "ep-action",
      attrs: { "aria-label": `Play episode ${num != null ? num : ""}` },
      onClick: () => {
        setQueue(queue, queueIndex);
        playEpisode(queue[queueIndex]);
      }
    }, svg('<path d="M8 5.2v13.6L19 12z"/>', 18, { fill: "currentColor", stroke: "none" })));
  } else {
    row.appendChild(el("button", {
      class: "ep-action locked",
      attrs: { "aria-label": `Unlock episode ${num != null ? num : ""}` },
      onClick: () => {
        const story = State.story.data;
        if (story && State.story.plans.length) openPurchaseSheet(story);
        else if (story) {
          // Re-fetch to be certain about plans.
          Api.get(`/api/story/${encodeURIComponent(story.id)}`)
            .then(d => {
              State.story.plans = (d && Array.isArray(d.plans)) ? d.plans : [];
              if (State.story.plans.length) openPurchaseSheet(story);
              else toast("No purchase options are available for this story yet.", "info");
            })
            .catch(() => toast("Could not load purchase options.", "error"));
        } else {
          toast("Open the story page to see purchase options.", "info");
        }
      }
    }, svg('<rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/>', 18)));
  }

  return row;
}

async function loadLibrary(host) {
  host.textContent = "";
  const loading = el("div");
  for (let i = 0; i < 4; i++) loading.appendChild(el("div", { class: "sk sk-row" }));
  host.appendChild(loading);

  try {
    const data = await Api.get("/api/library", { tab: State.library.tab });
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    State.library.items = items;
    host.textContent = "";

    if (!items.length) {
      const messages = {
        continue: ["Nothing in progress", "Start listening to a story and it will appear here."],
        owned: ["No owned stories yet", "Stories you purchase will appear here."],
        ranges: ["No episode ranges purchased", "Purchased episode ranges will appear here."],
        rentals: ["No active rentals", "Active rentals will appear here with their expiry."],
        expired: ["No expired rentals", "Expired rentals are kept here for your reference."],
        history: ["No listening history", "Episodes you play will appear here."]
      };
      const m = messages[State.library.tab] || ["Nothing here yet", ""];
      host.appendChild(emptyBox(m[0], m[1], "Browse stories", () => navigate("discover")));
      return;
    }

}

function LibraryItem(item) {
  const story = item.story || item;
  const wrap = el("div", { class: "story-row", style: { flexDirection: "column", alignItems: "stretch", cursor: "default" } });

  const top = el("div", { style: { display: "flex", gap: "12px" } });

  const cw = el("div", { class: "cover-wrap" });
  cw.appendChild(coverImage(story.cover_url || story.cover, story.title, ""));
  const img = cw.querySelector("img");
  if (img) { img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover"; }
  top.appendChild(cw);

  const body = el("div", { class: "body" });
  body.appendChild(el("div", { class: "title", text: story.title || "Untitled" }));

  const chips = el("div", { class: "chip-row" });
  const entitlement = item.entitlement_type || item.type || item.access_type;
  if (entitlement) {
    chips.appendChild(el("span", { class: "chip", text: entitlementLabel(entitlement) }));
  }
  if (item.episode_start != null && item.episode_end != null) {
    chips.appendChild(el("span", { class: "chip plain", text: `Ep ${item.episode_start}–${item.episode_end}` }));
  }
  if (item.expires_at) {
    const expired = new Date(item.expires_at).getTime() < Date.now();
    chips.appendChild(el("span", {
      class: "chip plain",
      style: expired ? { color: "#ff8a87", borderColor: "rgba(239,83,80,.35)" } : null,
      text: `${expired ? "Expired" : "Expires"} ${formatDate(item.expires_at)}`
    }));
  }
  if (chips.childNodes.length) body.appendChild(chips);

  if (item.last_episode_number != null) {
    body.appendChild(el("div", { class: "tiny muted", text: `Last played: Episode ${item.last_episode_number}` }));
  }

  const prog = Number(item.progress_percent);
  if (isFinite(prog) && prog > 0) {
    body.appendChild(el("div", { class: "ep-progress" },
      el("i", { style: { width: Math.min(100, prog) + "%" } })
    ));
  }

  top.appendChild(body);
  wrap.appendChild(top);

  // Actions
  const actions = el("div", { class: "row", style: { marginTop: "10px", gap: "8px" } });

  const isExpired = item.expires_at && new Date(item.expires_at).getTime() < Date.now();
  const canContinue = !isExpired && (item.last_episode_id || item.episode_start != null);

  if (canContinue && item.last_episode_id) {
    actions.appendChild(el("button", {
      class: "btn btn-primary btn-sm grow",
      text: "Continue",
      onClick: () => playEpisode({
        episodeId: item.last_episode_id,
        episodeNumber: item.last_episode_number,
        episodeTitle: item.last_episode_title || "Continue",
        storyId: story.id,
        storyTitle: story.title,
        cover: story.cover_url || story.cover
      })
    }));
  }

  actions.appendChild(el("button", {
    class: canContinue ? "btn btn-ghost btn-sm" : "btn btn-ghost btn-sm grow",
    text: "Open Story",
    onClick: () => navigate("story", { id: story.id })
  }));

  if (isExpired && State.library.tab === "expired") {
    actions.appendChild(el("button", {
      class: "btn btn-soft btn-sm",
      text: "Renew",
      onClick: () => navigate("story", { id: story.id })
    }));
  }

  wrap.appendChild(actions);
  return wrap;
}

function entitlementLabel(type) {
  const map = {
    owned: "Owned",
    full: "Full access",
    full_story: "Full access",
    rented: "Rental",
    rent: "Rental",
    range: "Episode range",
    episode_range: "Episode range",
    pack: "Episode pack",
    episode_pack: "Episode pack",
    history: "History"
  };
  const t = String(type || "").toLowerCase();
  return map[t] || type;
}

const ORDER_STATUS_MAP = {
  awaiting_payment: { label: "Awaiting Payment", cls: "status-pending" },
  awaiting_payment_proof: { label: "Awaiting Payment Proof", cls: "status-pending" },
  pending_admin_verification: { label: "Pending Verification", cls: "status-pending" },
  pending: { label: "Pending", cls: "status-pending" },
  awaiting_user_information: { label: "Awaiting Your Info", cls: "status-info" },
  approved: { label: "Approved", cls: "status-approved" },
  paid: { label: "Paid", cls: "status-approved" },
  rejected: { label: "Rejected", cls: "status-rejected" },
  cancelled: { label: "Cancelled", cls: "status-neutral" },
  canceled: { label: "Cancelled", cls: "status-neutral" },
  expired: { label: "Expired", cls: "status-neutral" },
  refunded: { label: "Refunded", cls: "status-info" }
};

function orderStatusPill(status) {
  const key = String(status || "").toLowerCase();
  const entry = ORDER_STATUS_MAP[key];
  if (!entry) return el("span", { class: "status-pill status-neutral", text: status || "Unknown" });
  return el("span", { class: `status-pill ${entry.cls}`, text: entry.label });
}

function OrderCard(order) {
  const card = el("div", { class: "order-card" });

  const top = el("div", { class: "order-top" });
  const left = el("div", { style: { minWidth: "0", flex: "1" } });
  left.appendChild(el("div", { class: "order-story", text: order.story_title || (order.story && order.story.title) || "Story" }));
  left.appendChild(el("div", { class: "order-id", text: "Order " + (order.id || order.order_id || "--") }));
  top.appendChild(left);
  top.appendChild(orderStatusPill(order.status));
  card.appendChild(top);

  const dl = el("dl", { class: "order-grid" });
  const addRow = (k, v) => {
    if (v === null || v === undefined || v === "") return;
    dl.appendChild(el("dt", { text: k }));
    dl.appendChild(el("dd", { text: String(v) }));
  };
  addRow("Plan", order.plan_name || order.plan_label || planTypeLabel(order.plan_type));
  addRow("Amount", order.amount_display || (order.amount != null ? `${order.currency || ""} ${order.amount}`.trim() : null));
  addRow("Date", order.created_at ? formatDate(order.created_at) : null);
  addRow("Expires", order.expires_at ? formatDate(order.expires_at) : null);
  if (dl.childNodes.length) card.appendChild(dl);

  const actions = el("div", { class: "row", style: { marginTop: "4px" } });
  actions.appendChild(el("button", {
    class: "btn btn-soft btn-sm grow",
    text: "Refresh Status",
    onClick: async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = "Checking…";
      try {
        const data = await Api.get(`/api/orders/${encodeURIComponent(order.id || order.order_id)}`, null, { dedupeKey: null });
        const updated = (data && data.order) || data;
        if (updated && updated.status) {
          order.status = updated.status;
          const fresh = OrderCard(order);
          card.replaceWith(fresh);
        }
        toast("Status updated.", "success");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Refresh Status";
        toast(err.message || "Could not refresh status.", "error");
      }
    }
  }));
  card.appendChild(actions);

  return card;
}

function openOrdersSheet() {
  const content = el("div");
  content.appendChild(el("div", { class: "sk sk-row", style: { height: "90px" } }));

  const overlay = Overlay.open({
    title: "My Purchases",
    kind: "sheet",
    content
  });

  Api.get("/api/orders", null, { dedupeKey: null })
    .then(data => {
      const items = (data && Array.isArray(data.items)) ? data.items : [];
      content.textContent = "";
      if (!items.length) {
        content.appendChild(emptyBox("No orders yet", "Your purchase orders will appear here.", "Browse stories", () => {
          Overlay.close();
          navigate("discover");
        }));
        return;
      }
      content.appendChild(el("div", { class: "tiny muted mb-8", text:
        "Payment approval is handled by the bot and reviewed by an administrator. Pull the status any time." }));
      for (const o of items) content.appendChild(OrderCard(o));
    })
    .catch(err => {
      content.textContent = "";
      content.appendChild(errorBox(err.message, () => { Overlay.close(); openOrdersSheet(); }));
    });
}

async function loadAdminStories(host) {
  host.textContent = "";
  for (let i = 0; i < 5; i++) host.appendChild(el("div", { class: "sk sk-row", style: { height: "70px" } }));

  try {
    const data = await Api.get("/api/admin/stories", {
      q: State.admin.stories.q,
      page: State.admin.stories.page
    });
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    host.textContent = "";

    if (!items.length) {
      host.appendChild(emptyBox("No stories", "Create your first story to get started."));
      return;
    }

    for (const story of items) {
      const row = el("div", { class: "story-row", style: { marginBottom: "9px", cursor: "default" } });
      const cw = el("div", { class: "cover-wrap" });
      cw.appendChild(coverImage(story.cover_url || story.cover, story.title, ""));
      const im = cw.querySelector("img");
      if (im) { im.style.width = "100%"; im.style.height = "100%"; im.style.objectFit = "cover"; }
      row.appendChild(cw);

      const body = el("div", { class: "body" });
      body.appendChild(el("div", { class: "title", text: story.title || "Untitled" }));
      const chips = el("div", { class: "chip-row" });
      chips.appendChild(el("span", {
        class: "chip" + (story.published ? "" : " plain"),
        text: story.published ? "Published" : "Draft"
      }));
      if (story.episode_count != null) chips.appendChild(el("span", { class: "chip plain", text: `${story.episode_count} eps` }));
      if (story.genre) chips.appendChild(el("span", { class: "chip plain", text: story.genre }));
      body.appendChild(chips);

      const actions = el("div", { class: "row wrap", style: { marginTop: "8px", gap: "6px" } });
      actions.appendChild(el("button", {
        class: "btn btn-soft btn-sm", text: "Edit",
        onClick: () => openStoryEditor(story, () => loadAdminStories(host))
      }));
      actions.appendChild(el("button", {
        class: "btn btn-soft btn-sm", text: "Preview",
        onClick: () => navigate("story", { id: story.id })
      }));
      actions.appendChild(el("button", {
        class: "btn btn-ghost btn-sm",
        text: story.published ? "Unpublish" : "Publish",
        onClick: async (e) => {
          const btn = e.currentTarget;
          btn.disabled = true;
          try {
            await Api.post(`/api/admin/story/${encodeURIComponent(story.id)}/publish`, {
              published: !story.published
            }, { dedupeKey: null });
            toast(story.published ? "Story unpublished." : "Story published.", "success");
            loadAdminStories(host);
          } catch (err) {
            btn.disabled = false;
            toast(err.message || "Action failed.", "error");
          }
        }
      }));
      actions.appendChild(el("button", {
        class: "btn btn-danger btn-sm", text: "Delete",
        onClick: () => confirmDeleteStory(story, () => loadAdminStories(host))
      }));
      body.appendChild(actions);

      row.appendChild(body);
      host.appendChild(row);
    }
  } catch (err) {
    host.textContent = "";
    host.appendChild(errorBox(err.message, () => loadAdminStories(host)));
  }
}

function confirmDeleteStory(story, onDone) {
  const content = el("div");
  content.appendChild(el("p", {
    style: { margin: "0 0 8px", fontSize: "13.5px", lineHeight: "1.55" },
    text: `Are you sure you want to delete "${story.title || "this story"}"?`
  }));
  content.appendChild(el("p", {
    class: "tiny muted",
    style: { margin: "0" },
    text: "Existing purchase history and entitlements are preserved by the backend. This action cannot be undone from the app."
  }));

  const confirmBtn = el("button", { class: "btn btn-danger", text: "Delete Story" });
  Overlay.open({
    title: "Confirm Deletion",
    content,
    footer: el("div", { class: "row", style: { width: "100%" } },
      el("button", { class: "btn btn-soft", text: "Cancel", onClick: () => Overlay.close() }),

    )
  });

  confirmBtn.addEventListener("click", async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Deleting…";

      Overlay.close();
      toast("Story deleted.", "success");
      if (onDone) onDone();
