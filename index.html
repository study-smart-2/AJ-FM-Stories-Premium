<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJ's FM Stories Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b101c; --panel:#141b2b; --panel2:#1a2338; --line:#27324d; --gold:#d6ab4f; --gold-2:#f1d48a;
  --text:#f3ecda; --muted:#a3adc2; --gold-rgb:214,171,79; --ok-rgb:108,197,154; --cv-a:#243052; --cv-b:#0f1526; --surf:#10172a; --nav-bg:#0e1424; --sk-a:#141b2b; --sk-b:#1e2842; --feat-a:#1d2646; --soft:#d4cdb9; --wish-bg:rgba(8,12,22,.7); color-scheme:dark; --ok:#6cc59a; --bad:#e27b7b; --warn:#e8b64c; --nav:60px; --mini:68px;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:40px}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px)}
body.hasplayer{padding-bottom:calc(var(--nav) + var(--mini) + env(safe-area-inset-bottom,0px) + 16px)}
h1,h2,h3,h4{margin:0}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--gold-2);line-height:1}
.brand span{color:var(--text);font-weight:600}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--gold-2)}
.pad{padding:0 16px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.promo{margin:4px 16px 14px;padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,#3a2a0c,#171f35);border:1px solid var(--gold);color:var(--gold-2);font-weight:700}
.promo small{display:block;color:var(--text);font-weight:400;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);min-height:38px}
.chip.on{border-color:var(--gold);color:var(--gold-2);background:rgba(var(--gold-rgb),.1)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:10px 16px 8px}
.sec{font-family:var(--serif);font-size:24px;line-height:1.1}
.link{background:none;border:0;color:var(--gold-2);padding:6px 0;font-size:13.5px;min-height:36px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 12px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none;align-items:flex-start}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:136px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 16px;align-items:start}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{display:block;text-align:left;background:none;border:0;padding:0;min-width:0}
.cv{aspect-ratio:3/4;width:100%;border-radius:12px;background:linear-gradient(160deg,var(--cv-a),var(--cv-b));border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative}
.cv.has-img{aspect-ratio:auto;display:block;background:var(--surf)}
.cv.has-img img{width:100%;height:auto;display:block}
.cv .fb{display:flex;aspect-ratio:3/4;align-items:center;justify-content:center;font-size:44px}
.badge{position:absolute;top:8px;left:8px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:1}
.card b{display:block;margin-top:8px;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.card small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.card .pr{color:var(--gold-2);font-weight:700;margin-top:2px;display:block}
.empty{padding:36px 22px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.msg{margin:10px 16px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.msg.bad{border-color:var(--bad);color:var(--text)}
/* skeletons */
.sk{background:linear-gradient(90deg,var(--sk-a) 25%,var(--sk-b) 50%,var(--sk-a) 75%);background-size:200% 100%;border-radius:12px}
@media (prefers-reduced-motion:no-preference){.sk{animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.sk.card-sk{aspect-ratio:3/4;width:136px;flex:none}
.sk.line{height:16px;margin:8px 16px}
.sk.hero{height:150px;margin:6px 16px}
/* featured + continue */
.feat{display:flex;gap:14px;margin:6px 16px 12px;padding:12px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(130deg,var(--feat-a),var(--surf));text-align:left;width:calc(100% - 32px)}
.feat .cv{width:112px;flex:none}
.feat h3{font-family:var(--serif);font-size:25px;line-height:1.05;color:var(--gold-2);overflow-wrap:anywhere}
.feat p{margin:6px 0 10px;color:var(--soft);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat .tagline{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.cont{flex:none;width:250px;display:flex;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;scroll-snap-align:start}
.cont .cv{width:56px;flex:none;font-size:26px}
.cont b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.cont small{color:var(--muted);display:block;font-size:12.5px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
/* nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:4;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--nav-bg);border-top:1px solid var(--line)}
.bnav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.bnav button.on{color:var(--gold-2)}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--ink);overflow:auto;overflow-x:hidden;z-index:6;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet.open{display:block}
body.hasplayer .sheet{padding-bottom:calc(var(--mini) + env(safe-area-inset-bottom,0px) + 40px)}
#fullplayer{z-index:10}#editor,#epman,#topics{z-index:8}#topiced,#cpedit{z-index:9}#admin{z-index:7}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:10px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#1a1405;font-weight:700;padding:11px 16px;border-radius:10px;min-height:44px}
.btn.ghost{background:transparent;color:var(--gold-2)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.small{padding:6px 12px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hero{padding:2px 16px 14px;text-align:center;background:linear-gradient(#1a2444,var(--ink))}
.hero .cv{width:168px;margin:6px auto 14px;font-size:56px}
.hero .cv.has-img{display:inline-block;width:auto;max-width:80%;margin:6px 0 14px}
.hero .cv.has-img img{width:auto;max-width:100%;max-height:50vh}
h2.title{font-family:var(--serif);font-size:32px;line-height:1.05;margin:0 0 4px;color:var(--gold-2);overflow-wrap:anywhere}
.by{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.tag.live{border-color:var(--ok);color:var(--ok)}.tag.gold{border-color:var(--gold);color:var(--gold-2)}.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.warn{border-color:var(--warn);color:var(--warn)}
.desc{margin:12px 16px 2px;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-size:15px;overflow-wrap:anywhere}
.h3{font-family:var(--serif);font-size:23px;margin:16px 16px 10px}
.plans{display:grid;gap:10px;padding:0 16px}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:rgba(var(--gold-rgb),.07);min-height:56px}
.plan span{font-weight:700;min-width:0;overflow-wrap:anywhere}
.plan small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.plan b{color:var(--gold-2);font-size:17px;white-space:nowrap}
.plan.free{border-color:var(--ok);background:rgba(var(--ok-rgb),.08)}.plan.free b{color:var(--ok)}
.plan.have{border-color:var(--line);background:var(--panel);opacity:.8}
.info{margin:0 16px 10px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.info b{display:block;margin-bottom:2px}.info p{margin:0;color:var(--muted);font-size:13.5px}
.access{margin:10px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--ok);background:rgba(var(--ok-rgb),.08);font-size:13.5px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}
.ctl input,.ctl select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 10px}
.pager span{color:var(--muted);font-size:13.5px;text-align:center;flex:1}
.jump{display:flex;gap:8px;padding:0 16px 10px}
.jump input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px;min-width:0}
.ep{display:flex;gap:10px;align-items:center;width:calc(100% - 32px);margin:0 16px 8px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:52px}
.ep.on{border-color:var(--gold);background:rgba(var(--gold-rgb),.1)}
.ep.lock{opacity:.65}
.ep .n{min-width:42px;color:var(--gold-2);font-weight:700}
.ep .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep small{color:var(--muted);white-space:nowrap}
.eprow{display:flex;align-items:center;gap:6px;margin:0 16px 8px}
.eprow .ep{flex:1;min-width:0;width:auto;margin:0}
.dl{flex:none;min-width:50px;min-height:52px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--gold-2);font-weight:700;font-size:15px}
.dl.done{border-color:var(--ok);color:var(--ok)}.dl.run,.dl.queued{border-color:var(--gold)}.dl.pause{border-color:var(--bad);color:var(--bad)}
.dlx{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--gold-2);font-size:13px;min-height:40px;margin:6px 6px 0 0}
.dlx.on{border-color:var(--gold);background:rgba(var(--gold-rgb),.15)}
#dlsheet{z-index:8}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.free{border-color:var(--ok);color:var(--ok)}.pill.owned{border-color:var(--gold);color:var(--gold-2)}.pill.lock{border-color:var(--bad);color:var(--bad)}
/* mini player */
.mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 26px);z-index:9;background:var(--surf);border:1px solid var(--gold);border-radius:14px;padding:8px 10px;display:none;align-items:center;gap:10px;height:var(--mini)}
.mini.show{display:flex}
.mini .mcv{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--cv-a);display:flex;align-items:center;justify-content:center}
.mini .mcv img{width:100%;height:100%;object-fit:cover}
.mini .mt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.mini .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button.mb{background:none;border:0;color:var(--gold-2);font-size:20px;min-width:44px;height:44px;border-radius:50%}
.mini button#mPlay{background:var(--gold);color:#1a1405}
.mini .mbar{position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mini .mbar i{display:block;height:100%;width:0;background:var(--gold)}
/* full player */
.fp{padding:0 20px 30px;text-align:center}
.fp .cv{width:min(62vw,260px);margin:8px auto 16px}
.fp .cv.has-img{width:auto;max-width:78%;display:inline-block}.fp .cv.has-img img{width:auto;max-width:100%;max-height:38vh}
.fp h2{font-family:var(--serif);font-size:26px;line-height:1.1;color:var(--gold-2);overflow-wrap:anywhere}
.fp .state{min-height:22px;color:var(--muted);font-size:13.5px;margin:6px 0}
.fp .state.bad{color:var(--bad)}
.fp input[type=range]{width:100%;accent-color:var(--gold)}
.fp .times{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.fp .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.fp .row button{background:none;border:0;color:var(--gold-2);font-size:20px;min-width:52px;height:52px}
.fp #fPlay{background:var(--gold);color:#1a1405;border-radius:50%;width:64px;height:64px;font-size:26px}
.fp .opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;text-align:left}
.fp .opt b{display:block;margin-bottom:6px}
.fp .rr{display:flex;align-items:center;gap:8px}.fp .rr input{flex:1}
.fp .rr button,.fp .chiprow button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--gold-2);font-size:13px;min-height:40px}
.fp .bufbar{height:4px;border-radius:2px;background:var(--line);margin:-2px 0 4px;overflow:hidden}.fp .bufbar i{display:block;height:100%;width:0;background:rgba(var(--gold-rgb),.45)}
.fp .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fp .chiprow button.on{border-color:var(--gold);background:rgba(var(--gold-rgb),.15)}
/* forms and admin */
.field{display:block;margin:0 16px 12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select,.optrow input,.box input,.box select,.box textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.field textarea,.box textarea{min-height:100px;resize:vertical}
.field.check{display:flex;gap:10px;align-items:center}.field.check input{width:22px;height:22px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}.two .field{margin:0 0 12px}
.optrow{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.o4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.o4 input{padding:8px 6px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.note{font-size:12.5px;color:var(--muted);margin:8px 16px;overflow-wrap:anywhere}
.mrow{margin:0 16px 10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.mrow h4{font-family:var(--serif);font-size:19px;overflow-wrap:anywhere}
.box{margin:0 16px 14px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.box>b{display:block;margin-bottom:8px}
.seg{display:flex;gap:6px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--mini) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;display:none;max-width:92%;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}

/* home v2: header, carousel, deals, themes */
.appbar{gap:10px;justify-content:flex-start}
.avatar{flex:none;width:40px;height:40px;min-height:40px;border-radius:50%;border:1.5px solid var(--gold);background:var(--panel2) center/cover;color:var(--gold-2);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.avatar.big{width:84px;height:84px;font-size:32px;margin:0 auto}
.hgreet{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hgreet small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgreet b{color:var(--gold-2);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hicons{display:flex;gap:6px;align-items:center}
.hic{position:relative;width:36px;min-width:36px;height:36px;min-height:36px;padding:0;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--gold-2);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.rail .slide{flex:none;width:78%;max-width:300px;position:relative;border-radius:16px;overflow:hidden;padding:0;border:1px solid var(--gold);background:var(--panel);text-align:left;scroll-snap-align:center}
.slide .cv{aspect-ratio:4/5;border:0;border-radius:0}
.sinfo{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(8,12,22,.92));color:#f3ecda;display:flex;flex-direction:column;gap:2px}
.sinfo b{font-family:var(--serif);font-size:22px;line-height:1.05}.sinfo small{color:#cfd6e6}.sinfo .btn{align-self:flex-start;margin-top:6px;min-height:36px;padding:7px 14px}
.flash{margin:6px 0 10px;padding:6px 0 2px;background:linear-gradient(120deg,rgba(var(--gold-rgb),.14),transparent);border-block:1px solid var(--gold)}
.card s{opacity:.55;margin-right:5px;font-weight:400}.card .cd{color:var(--warn);font-weight:700}
.contw{flex:none;position:relative;scroll-snap-align:start}
.cx{position:absolute;top:-6px;right:-6px;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:17px;line-height:1;z-index:2}
.card.up{position:relative}
.plain{background:none;border:0;padding:0;text-align:left;width:100%;display:block}

/* request a story + tracker */
.rq-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 16px 14px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.rq-tab{min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px}

.rq-chips{display:flex;gap:8px;flex-wrap:wrap}

/* story page v2: banner hero, plan pills, sticky action bar */
.sh{position:relative;padding:64px 16px 18px;text-align:center;overflow:hidden}
.sh-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(30px) brightness(.5) saturate(1.25);transform:scale(1.1)}
.sh:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 35%,var(--ink) 98%)}
.sh>*{position:relative;z-index:1}
.sh>.sh-bg{position:absolute;z-index:0}
.sh .cv{width:min(46vw,190px);margin:0 auto 14px;box-shadow:0 16px 38px rgba(0,0,0,.5)}
.sh .cv.has-img{display:block}
.sh-top{position:absolute!important;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3!important}
.sh-top>div{display:flex;gap:8px}
.fab{width:42px;height:42px;min-height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(8,12,22,.55);color:#f3ecda;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
.fab[aria-pressed=true]{color:#ff6f8e;border-color:#ff6f8e}
.sh .title{text-shadow:0 2px 14px rgba(0,0,0,.45)}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.pill2{flex:1 1 calc(50% - 8px);min-width:140px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-height:58px;display:flex;flex-direction:column;gap:2px}
.pill2 b{font-size:14px;overflow-wrap:anywhere}.pill2 small{color:var(--muted);font-size:11.5px}.pill2 .pp{color:var(--gold-2);font-weight:800;font-size:15px}
.pill2.on{border:2px solid var(--gold);background:rgba(var(--gold-rgb),.12);padding:9px 11px}
.pill2.free{border-color:var(--ok)}.pill2.free .pp{color:var(--ok)}
.pill2.have{opacity:.7}.pill2.have .pp{color:var(--muted)}
.irow{display:flex;gap:12px;align-items:flex-start;margin:0 16px 8px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.irow .ic{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(var(--gold-rgb),.14);display:flex;align-items:center;justify-content:center;font-size:17px}
.irow b{display:block;font-size:13.5px}.irow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.sbar{position:sticky;bottom:0;z-index:5;margin-top:14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);border-top:1px solid var(--gold);box-shadow:0 -8px 24px rgba(0,0,0,.25);display:grid;gap:8px}
.sbar:empty{display:none}
body.hasplayer .sbar{bottom:calc(var(--mini) + 12px)}
.sb-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#sbBuy{white-space:nowrap;flex:none}
.sb-plan{min-width:0}.sb-plan small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-plan b{font-size:20px;color:var(--gold-2)}
.sb-btns{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.sb-btns .btn{min-height:46px;padding:10px 8px;font-size:14px}
/* coupons and offers */
#couponed{z-index:9}
.cpbox{margin:0 16px 12px;padding:12px;border-radius:14px;border:1px dashed var(--gold);background:var(--panel);display:grid;gap:8px}
.cp-row{display:flex;gap:8px}
.cp-row input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px;text-transform:uppercase}
.cp-on{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ok);font-size:13.5px}
.obn{flex:none;width:280px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid var(--gold);background:linear-gradient(120deg,var(--feat-a),var(--surf));text-align:left;padding:0;scroll-snap-align:start}
.obn img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block}
.obn .obt{padding:10px 12px;display:flex;flex-direction:column;gap:2px}.obn b{color:var(--gold-2);font-size:15px}.obn small{color:var(--soft);font-size:12.5px}
.ocard{margin:0 16px 12px;border-radius:16px;overflow:hidden;border:1px solid var(--gold);background:var(--panel)}
.ocard img{width:100%;display:block}.ocard .obody{padding:12px 14px}.ocard p{margin:4px 0 0;color:var(--soft);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.cpcard{display:flex;gap:10px;align-items:center;margin:0 16px 10px;padding:12px;border-radius:16px;border:1px dashed var(--gold);background:var(--panel)}
.cpcard .cpl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.cpcard small{color:var(--muted);font-size:12px}
.cpcode{align-self:flex-start;padding:2px 10px;border-radius:8px;background:rgba(var(--gold-rgb),.16);color:var(--gold-2);font-weight:800;letter-spacing:.08em;font-size:15px}

<script>
/* ============ SETTINGS: edit these ============ */
const API_URL      = "https://aj-bot-vbxn.onrender.com";   // your bot server address
const BOT_USERNAME = "AJ_FM_Stories_Premium_Robot";      // your bot, without @
const CURRENCY     = "₹";
const MINIAPP_SHORT = "store";   // short name of your Mini App from BotFather (/newapp). With it, shared links open the Mini App directly. Leave empty to share a bot link instead.
const PROMO_TITLE  = "New stories every week";
const PROMO_TEXT   = "Rent or buy a story and listen right here in the app.";
const HOW_IT_WORKS = "Pick a plan, pay, and send the payment screenshot to our bot. Once it is confirmed, your episodes unlock in this app.";
const PAGE_SIZE    = 50;
/* ============================================== */

const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0b101c'); tg.setBackgroundColor('#0b101c'); }catch(e){} }

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const deb = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const money = n => Number(n) === 0 ? 'Free' : CURRENCY + Number(n);
const clock = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60, p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
};
const dateStr = ts => ts ? new Date(ts * 1000).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';
function toast(msg, ms = 2800){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms);
}
const busy = new Set();
async function once(key, fn){            // ignores repeated taps while the same action is still running
  if (busy.has(key)) return; busy.add(key);
  try{ return await fn(); } finally { busy.delete(key); }
}
const ctls = {};
function fresh(key){ if (ctls[key]) ctls[key].abort(); ctls[key] = new AbortController(); return ctls[key].signal; }   // newest request wins

async function api(path, opts = {}){
  const {timeout = 25000, retry = (opts.method || 'GET') === 'GET', ...init} = opts;
  const url = API_URL.replace(/\/$/, '') + path;
  for (let attempt = 0; ; attempt++){
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
    if (init.signal) init.signal.addEventListener('abort', () => ctl.abort(), {once:true});
    try{
      const r = await fetch(url, {...init, signal: ctl.signal, headers: {'Content-Type':'application/json', 'X-Init-Data': tg ? tg.initData : '', ...(init.headers || {})}});
      clearTimeout(timer);
      if (!r.ok){
        let data = null; try{ data = await r.json(); }catch(e){ try{ data = {message: await r.text()}; }catch(e2){} }
        const e = new Error((data && data.message) || `Request failed (${r.status})`); e.status = r.status; e.data = data;
        if (retry && attempt < 1 && [502, 503, 504].includes(r.status)){ await sleep(1500); continue; }
        throw e;
      }
      return await r.json();
    }catch(e){
      clearTimeout(timer);
      if (e.status) throw e;
      if (init.signal && init.signal.aborted){ e.aborted = true; throw e; }
      if (retry && attempt < 1){ await sleep(1500); continue; }
      const ne = new Error(e.name === 'AbortError' ? 'The server took too long to answer. Please try again.' : 'No connection to the server. Check your internet.'); ne.network = true; throw ne;
    }
  }
}
const errText = e => e.status === 401 ? 'Please open this app from Telegram.' : e.status === 429 ? 'Too many requests. Wait a moment and try again.' : (e.message || 'Something went wrong.');

const isImg = c => !!c && /^(https?:\/\/|data:image\/)/.test(c);
const cover = (c, badge) => `<div class="cv${isImg(c) ? ' has-img' : ''}">${badge ? `<span class="badge">${esc(badge)}</span>` : ''}${
  isImg(c) ? `<img src="${esc(c)}" alt="" loading="lazy" data-fb="📖">` : esc(c || '📖')}</div>`;
document.addEventListener('error', e => {          // a cover that fails to load becomes the book icon
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset.fb !== undefined){ const s = document.createElement('span'); s.className = 'fb'; s.textContent = t.dataset.fb; t.replaceWith(s); }
}, true);

const stack = [];
function openSheet(id){ $('#' + id).classList.add('open'); if (!stack.includes(id)) stack.push(id); if (tg) tg.BackButton.show(); }
function closeSheet(id){ $('#' + id).classList.remove('open'); const i = stack.indexOf(id); if (i >= 0) stack.splice(i, 1); if (tg && !stack.length) tg.BackButton.hide(); }
function goBack(){ const id = stack[stack.length - 1]; if (id === 'story' && typeof storyBack === 'function') return storyBack(); if (id) closeSheet(id); }

function goBot(payload){
  const url = `https://t.me/${BOT_USERNAME}?start=${payload}`;
  if (tg && tg.openTelegramLink){ tg.openTelegramLink(url); if (audio.paused) setTimeout(() => { try{ tg.close(); }catch(e){} }, 350); }   // stay open if audio is playing
  else window.open(url, '_blank');
}

/* ---------- shared pieces ---------- */
const priceMax = s => { if (s.max_price != null) return +s.max_price; if (s.options && s.options.length) return Math.max(...s.options.map(o => +o.price)); return null; };
const priceLabel = s => {
  if (s.plans === 0) return 'Price soon';
  if (s.deal) return 'From ' + money(s.eff_price) + ' (-' + s.deal.pct + '%)';
  const hi = priceMax(s), lo = +s.min_price;
  if (hi != null && hi > lo) return money(lo) + ' - ' + money(hi);          // low and high price of the story's plans
  return lo === 0 ? 'Free' : (s.has_free ? 'Free + paid' : 'From ' + money(lo));
};

const cardSk = n => Array.from({length: n}, () => '<div class="sk card-sk"></div>').join('');
const retryBox = (msg, id) => `<div class="empty"><div>${esc(msg)}</div><button class="btn" id="${id}">Try again</button></div>`;

/* ---------- state ---------- */

Object.assign(S, {wish:new Set(), tier:0, notices:[], io:null, feed:{items:[], offset:0, state:'idle', done:false, seeded:false, err:''}});

/* ---------- language, theme, header ---------- */

  en: {poff:'Available Coupons & Offers', otitle:'Coupons & Offers', cpph:'Promo code', cpapply:'Apply', cpremove:'Remove', cpapplied:'Coupon {c} applied', cpsave:'You save {a}', cpnone:'No coupons are running right now. Check back soon.', cpcopy:'Copy', cpcopied:'Code copied', cpuse:'Use in cart', cpmin:'Min order {m}', cpexp:'Valid till {d}', cpavail:'{n} coupons available', cdisc:'Discount',

const CP = {code: store.get('ajcp', ''), res: {}, max: null, msg: '', draft: '', offers: {banners: [], coupons: []}};
const cpKey = (sid, oid) => sid + '|' + oid;
const cpRes = (sid, oid) => { const r = CP.res[cpKey(sid, oid)]; return CP.code && r && r.ok ? r : null; };        // the checked result for a plan, or null
const buyPayload = (sid, oid) => { const base = `buy_${sid}_${oid}`, p = cpRes(sid, oid) ? base + '_' + CP.code : base; return p.length <= 64 ? p : base; };   // the bot checks the code again
const CP_DEAD = ['not_found', 'expired', 'inactive', 'used_up', 'user_limit', 'scheduled'];
async function cpValidate(items){
  if (!CP.code || !items.length) return;
  try{
    const d = await api('/api/coupon/validate', {method: 'POST', retry: false, body: JSON.stringify({code: CP.code, items: items.map(i => ({story_id: i.sid, option_id: i.oid}))})});
    d.results.forEach(r => { CP.res[cpKey(r.story_id, r.option_id)] = r; }); CP.max = d.max_items == null ? null : +d.max_items;
    CP.msg = d.valid ? '' : ((d.results[0] && d.results[0].message) || 'That code is not valid.');
  }catch(e){ CP.msg = errText(e); }
}
async function cpApply(raw, items){
  const code = String(raw || '').replace(/\s+/g, '').toUpperCase();
  if (!code){ toast(tr('cpph')); return; }
  CP.code = code; CP.res = {}; CP.msg = '';
  if (!items.length){ store.set('ajcp', code); CP.draft = ''; toast(tr('cpapplied', {c: code})); return; }       // nothing to check against yet: it is checked when a plan is picked
  await cpValidate(items);
  if (!items.some(i => cpRes(i.sid, i.oid))){ const m = CP.msg || 'That code is not valid.'; cpRemove(); CP.msg = m; toast(m, 4500); return; }
  store.set('ajcp', code); CP.draft = ''; CP.msg = ''; toast(tr('cpapplied', {c: code}));
}
function cpRemove(){ CP.code = ''; CP.res = {}; CP.msg = ''; store.set('ajcp', ''); }
function cpDropDead(){                                  // a saved code that no longer works for anything is forgotten
  const rs = Object.values(CP.res);

}

async function refreshCart(){                       // drop what is already owned or no longer sold; refresh price and plan name
  const sids = [...new Set(CART.map(i => i.sid))]; if (!sids.length) return;
  let changed = false, owned = 0;
  await Promise.all(sids.map(async sid => {
    try{
      const d = await api(`/api/story/${encodeURIComponent(sid)}?limit=1`, {timeout: 30000});
      const opts = d.story.options || [], a = d.access || {};
      CART = CART.filter(i => {
        if (i.sid !== sid) return true;
        const o = opts.find(x => String(x.id) === String(i.oid));
        if (!o || +o.price === 0){ changed = true; return false; }
        if (a.full || a.admin || (a.ranges || []).some(r => (r.from || 0) === (o.from || 0) && (r.to || 0) === (o.to || 0))){ changed = true; owned++; return false; }
        const tn = topicNameOf(d.story, o); if (payOf(o) !== i.price || o.label !== i.label || (i.topicName || '') !== tn){ i.price = payOf(o); i.label = o.label; i.topic = o.topic || ''; i.topicName = tn; changed = true; }
        return true;
      });
    }catch(e){ if (e.data && e.data.unavailable){ CART = CART.filter(i => i.sid !== sid); changed = true; } }
